 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102b52"/><stop offset="1" stop-color="#164e75"/></linearGradient>
