<rect width="1200" height="1660" fill="url(#bg)"/>
<rect width="1200" height="190" fill="url(#navy)"/>
<rect y="185" width="1200" height="5" fill="#f59e0b"/>
<text x="600" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#fff" letter-spacing="1">INDIA VIRTUAL LABS &amp; SIMULATION</text>
<text x="600" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#fff" letter-spacing="1">PROVIDERS DIRECTORY</text>
<text x="600" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dbeafe">A descriptive directory of selected Indian initiatives • Not a ranking</text>
<rect x="430" y="158" width="340" height="25" rx="12" fill="#1e40af" stroke="#93c5fd"/>
<text x="600" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">DIRECTORY LISTING • INDIA</text>

<g filter="url(#shadow)"><rect x="55" y="220" width="1090" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/></g>
<circle cx="105" cy="263" r="25" fill="#12345a"/><text x="105" y="269" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">01</text>
<text x="150" y="262" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Amrita Virtual Labs — Amrita Vishwa Vidyapeetham</text>
<text x="150" y="295" font-family="Arial,sans-serif" font-size="16" fill="#334155">University virtual laboratories spanning biological, chemical, physical and engineering sciences.</text>
<rect x="150" y="331" width="207" height="23" rx="11" fill="#e0f2fe"/><text x="164" y="347" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#075985">University virtual labs</text>
<text x="1120" y="347" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8">https://vlab.amrita.edu/</text>
<g filter="url(#shadow)"><rect x="55" y="382" width="1090" height="158" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/></g>
<circle cx="105" cy="425" r="25" fill="#12345a"/><text x="105" y="431" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">02</text>
<text x="150" y="424" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">GARRF — Gopalkrishna Advanced Rural Research Foundation</text>
<text x="150" y="457" font-family="Arial,sans-serif" font-size="16" fill="#334155">Kalam Research Zero Funding Lab • GARRF reports 300+ active experiments on its website, across</text>
<text x="150" y="480" font-family="Arial,sans-serif" font-size="16" fill="#334155">engineering and STEM areas. Founder: Dr. Annamdas Venu Gopal Madhav.</text>
<rect x="150" y="506" width="297" height="23" rx="11" fill="#e0f2fe"/><text x="164" y="522" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#075985">Independent • Privately developed</text>
<text x="1120" y="522" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8">https://garrf.in/kalam-zero-lab/</text>
<g filter="url(#shadow)"><rect x="55" y="557" width="1090" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/></g>
<circle cx="105" cy="600" r="25" fill="#12345a"/><text x="105" y="606" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">03</text>
<text x="150" y="599" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">FOSSEE — IIT Bombay</text>
<text x="150" y="632" font-family="Arial,sans-serif" font-size="16" fill="#334155">Promotes free/libre and open-source software for education, including Scilab, eSim, OpenFOAM, DWSIM and</text>
<text x="150" y="655" font-family="Arial,sans-serif" font-size="16" fill="#334155">OpenModelica, with lab-migration initiatives.</text>
<rect x="150" y="668" width="270" height="23" rx="11" fill="#e0f2fe"/><text x="164" y="684" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#075985">Open-source software ecosystem</text>
<text x="1120" y="684" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8">https://fossee.in/</text>
<g filter="url(#shadow)"><rect x="55" y="719" width="1090" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/></g>
<circle cx="105" cy="762" r="25" fill="#12345a"/><text x="105" y="768" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">04</text>
<text x="150" y="761" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">OLabs — AmritaCREATE &amp; C-DAC</text>
<text x="150" y="794" font-family="Arial,sans-serif" font-size="16" fill="#334155">Interactive school science laboratory experiments and simulations, aligned with school curricula; supported by</text>
<text x="150" y="817" font-family="Arial,sans-serif" font-size="16" fill="#334155">Government of India initiatives.</text>
<rect x="150" y="830" width="216" height="23" rx="11" fill="#e0f2fe"/><text x="164" y="846" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#075985">School-level online labs</text>
<text x="1120" y="846" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8">https://www.olabs.co.in/</text>
<g filter="url(#shadow)"><rect x="55" y="881" width="1090" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/></g>
<circle cx="105" cy="924" r="25" fill="#12345a"/><text x="105" y="930" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">05</text>
<text x="150" y="923" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Virtual Labs — Ministry of Education, Government of India</text>
<text x="150" y="956" font-family="Arial,sans-serif" font-size="16" fill="#334155">National virtual-laboratory initiative developed through a consortium of participating institutions, including</text>
<text x="150" y="979" font-family="Arial,sans-serif" font-size="16" fill="#334155">IITs, IIIT Hyderabad, Amrita, Dayalbagh, NITK and COEP.</text>
<rect x="150" y="992" width="252" height="23" rx="11" fill="#e0f2fe"/><text x="164" y="1008" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#075985">National academic consortium</text>
<text x="1120" y="1008" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8">https://www.vlab.co.in/</text>
<g filter="url(#shadow)"><rect x="55" y="1043" width="1090" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/></g>
<circle cx="105" cy="1086" r="25" fill="#12345a"/><text x="105" y="1092" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">06</text>
<text x="150" y="1085" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Virtual Labs — IIT Kharagpur</text>
<text x="150" y="1118" font-family="Arial,sans-serif" font-size="16" fill="#334155">Institute-hosted virtual laboratories covering areas such as robotics, mechanisms, electronics, signal</text>
<text x="150" y="1141" font-family="Arial,sans-serif" font-size="16" fill="#334155">processing, control, manufacturing and engineering sciences.</text>
<rect x="150" y="1154" width="189" height="23" rx="11" fill="#e0f2fe"/><text x="164" y="1170" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#075985">Institute-hosted labs</text>
<text x="1120" y="1170" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8">https://vlabs.iitkgp.ac.in/</text>
<g filter="url(#shadow)"><rect x="55" y="1205" width="1090" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/></g>
<circle cx="105" cy="1248" r="25" fill="#12345a"/><text x="105" y="1254" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">07</text>
<text x="150" y="1247" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Virtual Labs — IIT Roorkee</text>
<text x="150" y="1280" font-family="Arial,sans-serif" font-size="16" fill="#334155">Institute portal for online experiments and simulation-based laboratory learning across engineering and science</text>
<text x="150" y="1303" font-family="Arial,sans-serif" font-size="16" fill="#334155">disciplines.</text>
<rect x="150" y="1316" width="189" height="23" rx="11" fill="#e0f2fe"/><text x="164" y="1332" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#075985">Institute-hosted labs</text>
<text x="1120" y="1332" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8">https://vlab.iitr.ac.in/</text>
<rect x="55" y="1369" width="1090" height="150" rx="15" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="82" y="1405" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Directory notes</text>
<text x="82" y="1436" font-family="Arial,sans-serif" font-size="14" fill="#334155">• Entries are grouped as a directory, not ranked by quality, scale, funding or institutional status.</text>
<text x="82" y="1459" font-family="Arial,sans-serif" font-size="14" fill="#334155">• GARRF’s 300+ active-experiment figure is attributed to GARRF’s own published website description.</text>
<text x="82" y="1482" font-family="Arial,sans-serif" font-size="14" fill="#334155">• GARRF-developed models/solvers may be proprietary intellectual property, openly released, or freely accessible</text>
<text x="82" y="1505" font-family="Arial,sans-serif" font-size="14" fill="#334155">  under stated terms. “Free access” and “open-source licence” are not interchangeable.</text>
<line x1="55" y1="1566" x2="1145" y2="1566" stroke="#cbd5e1"/>
<text x="600" y="1600" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">◉ OpenAI  |  ChatGPT • Directory research &amp; preparation</text>
<text x="600" y="1628" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Prepared 25 November 2026 • Public website information reviewed; listings are descriptive, not endorsements</text>
</svg>