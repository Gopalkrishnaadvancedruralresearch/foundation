<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GARRF Interactive PPT Monograph • Issue 1 (4-Zone Interaction)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-abyss: #020712;
      --subtle-gray: #3a3a3a;
      --card-bg: #030c1c;
      --card-in: #091a36;
      --border-color: #1a3863;
      --gold: #f59e0b;
      --gold-glow: #fbbf24;
      --cyan: #38bdf8;
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--subtle-gray);
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 30% 15%, rgba(14, 43, 85, 0.4), transparent 60%),
        radial-gradient(circle at 75% 85%, rgba(6, 21, 45, 0.5), transparent 70%);
    }

    /* ---------------- HEADER ---------------- */
    header {
      background: rgba(255, 255, 255, 0.98);
      color: #07233b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #cbd5e1;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-titles h1 { font-size: 1.1rem; font-weight: 800; color: #07233b; line-height: 1.2; }
    .header-titles h2 { font-size: 0.85rem; font-weight: 700; font-style: italic; color: #b45309; }

    .flags-box { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; }
    .flag-icon { width: 30px; height: 18px; border-radius: 3px; display: inline-block; border: 0.5px solid #cbd5e1; position: relative; }
    .flag-in { background: linear-gradient(#ff9933 33.3%, #ffffff 33.3%, #ffffff 66.6%, #128807 66.6%); }
    .flag-sg { background: linear-gradient(#dc2626 50%, #ffffff 50%); }

    /* ---------------- TOOLBAR ---------------- */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      background: rgba(6, 19, 40, 0.85);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(8px);
      z-index: 95;
    }

    .nav-counter { font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; color: var(--gold-glow); font-weight: 700; }
    .btn-group { display: flex; align-items: center; gap: 8px; }
    .btn { background: var(--card-in); color: var(--text-white); border: 1px solid var(--border-color); padding: 7px 14px; font-size: 0.8rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .btn:hover { background: #153563; border-color: var(--cyan); color: var(--cyan); }
    .btn-gold { background: rgba(245, 158, 11, 0.15); border-color: var(--gold); color: var(--gold-glow); }

    /* ---------------- WORKSPACE ---------------- */
    .workspace {
      flex: 1;
      display: flex;
      padding: 20px 24px;
      gap: 20px;
      max-width: 1540px;
      margin: 0 auto;
      width: 100%;
      height: calc(100vh - 146px);
      position: relative;
    }

    /* Presentation Slide Panel (Left) */
    .slide-panel {
      flex: 1;
      height: 100%;
      background: #030a17;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
    }

    .slide-canvas-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: crosshair;
    }

    .main-slide-img {
      max-height: 98%;
      max-width: 98%;
      object-fit: contain;
      display: block;
    }

    /* Target Reticle / Magnifier Lens Ring on Active Slide */
    .target-lens {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px solid var(--gold-glow);
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
      z-index: 20;
    }

    /* Magnified Telemetry Beam Viewport (Right Side) */
    .zoom-panel {
      flex: 1;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
    }

    .zoom-display-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #020712;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .magnified-img-layer {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      transform-origin: 0 0;
      image-rendering: -webkit-optimize-contrast; 
    }

    /* FOOTER */
    footer {
      background: #050e20;
      border-top: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="header-titles">
      <h1>Gopalkrishna Advanced Rural Research Foundation (GARRF)</h1>
      <h2>Dr. APJ Abdul Kalam Research Zero Funding Initiative</h2>
    </div>
    <div class="flags-box">
      <span class="flag-icon flag-in" title="Bharat"></span>
      <span class="flag-icon flag-sg" title="Singapore"></span>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="nav-counter">SLIDE 1 / 25</div>
    <div class="btn-group">
      <button class="btn btn-gold">⚡ Arjun AI</button>
    </div>
  </div>

  <!-- WORKSPACE -->
  <main class="workspace">
    <!-- PRESENTATION SLIDE -->
    <section class="slide-panel">
      <div class="slide-canvas-wrap" id="canvasWrap">
        <img class="main-slide-img" id="mainSlide" src="magazine/0.png" alt="Lecture Slide">
        <div class="target-lens" id="targetLens"></div>
      </div>
    </section>

    <!-- MAGNIFIED VIEWPORT -->
    <section class="zoom-panel">
      <div class="zoom-display-stage" id="zoomDisplayStage">
        <img class="magnified-img-layer" id="zoomLayerImg" src="magazine/0.png" alt="Magnified View">
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div>Developed by GARRF Team</div>
  </footer>

  <script>
    const zoomPower = 3.5;
    const mainSlide = document.getElementById('mainSlide');
    const zoomLayerImg = document.getElementById('zoomLayerImg');
    const canvasWrap = document.getElementById('canvasWrap');
    const targetLens = document.getElementById('targetLens');
    const zoomDisplayStage = document.getElementById('zoomDisplayStage');

    canvasWrap.addEventListener('mousemove', e => {
      const imgRect = mainSlide.getBoundingClientRect();
      const wrapRect = canvasWrap.getBoundingClientRect();
      const xInImg = e.clientX - imgRect.left;
      const yInImg = e.clientY - imgRect.top;

      if (xInImg >= 0 && xInImg <= imgRect.width && yInImg >= 0 && yInImg <= imgRect.height) {
        targetLens.style.display = 'block';
        targetLens.style.left = `${e.clientX - wrapRect.left}px`;
        targetLens.style.top = `${e.clientY - wrapRect.top}px`;

        const normX = Math.max(0, Math.min(1, xInImg / imgRect.width));
        const normY = Math.max(0, Math.min(1, yInImg / imgRect.height));

        const stageW = zoomDisplayStage.clientWidth;
        const stageH = zoomDisplayStage.clientHeight;
        const magW = stageW * zoomPower;
        const magH = stageH * zoomPower;

        zoomLayerImg.style.width = `${magW}px`;
        zoomLayerImg.style.height = `${magH}px`;

        const offsetX = -(normX * magW - stageW / 2);
        const offsetY = -(normY * magH - stageH / 2);

        zoomLayerImg.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      } else {
        targetLens.style.display = 'none';
      }
    });

    canvasWrap.addEventListener('mouseleave', () => { targetLens.style.display = 'none'; });
  </script>
</body>
</html>
