<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charan Das - AI Desktop Buddy & Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #111d33 0%, #060a12 100%);
    --cyan-glow: #00f0ff;
    --cyan-light: #67e8f9;
    --dock-bg: rgba(13, 23, 42, 0.85);
    --dock-border: rgba(0, 240, 255, 0.25);
    --btn-hover: rgba(0, 240, 255, 0.15);
    --text-main: #f0f6fc;
    --text-muted: #8ca3c7;
    --card-bg: rgba(15, 23, 42, 0.95);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 14px;
    position: relative;
  }

  /* Webcam Preview for Gaze Tracking */
  #webcamVideo {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 140px;
    height: 105px;
    border-radius: 14px;
    border: 2px solid var(--cyan-glow);
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
    z-index: 100;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
  }

  /* Top Awaken Capsule */
  .awaken-pill {
    background: rgba(4, 30, 45, 0.9);
    border: 1px solid rgba(0, 240, 255, 0.4);
    padding: 8px 24px;
    border-radius: 30px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #4ade80;
    text-transform: uppercase;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
    cursor: pointer;
    transition: all 0.3s;
    z-index: 10;
  }

  .awaken-pill:hover {
    box-shadow: 0 0 32px rgba(0, 240, 255, 0.5);
    border-color: var(--cyan-glow);
  }

  .pulse-dot {
    width: 9px;
    height: 9px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 12px #22c55e;
    animation: pulseBlink 1.5s infinite ease-in-out;
  }

  @keyframes pulseBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  /* Main Robot Stage */
  .bot-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    flex: 1;
    margin-top: -6px;
    width: 100%;
  }

  .bot-body-wrapper {
    position: relative;
    width: 320px;
    height: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 15px 35px rgba(0, 240, 255, 0.22));
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.4, 1);
  }

  /* Antenna */
  .antenna-container {
    display: flex;
    justify-content: space-between;
    width: 170px;
    margin-bottom: -14px;
    z-index: 1;
  }

  .antenna-stalk {
    width: 8px;
    height: 40px;
    background: #64748b;
    border-radius: 4px;
    position: relative;
  }
  .antenna-stalk.left { transform: rotate(-28deg); transform-origin: bottom center; }
  .antenna-stalk.right { transform: rotate(28deg); transform-origin: bottom center; }
  
  .antenna-tip {
    width: 16px;
    height: 16px;
    background: var(--cyan-glow);
    border-radius: 50%;
    position: absolute;
    top: -10px;
    left: -4px;
    box-shadow: 0 0 20px var(--cyan-glow);
    animation: tipGlow 2s infinite alternate;
  }

  @keyframes tipGlow {
    from { box-shadow: 0 0 10px var(--cyan-glow); }
    to { box-shadow: 0 0 26px var(--cyan-glow), 0 0 40px #38bdf8; }
  }

  /* Head */
  .bot-head {
    width: 245px;
    height: 195px;
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 75%, #cbd5e1 100%);
    border-radius: 120px 120px 105px 105px;
    border: 5px solid #ffffff;
    box-shadow: 
      inset 0 6px 12px rgba(255, 255, 255, 0.9),
      inset 0 -10px 20px rgba(100, 116, 139, 0.35),
      0 12px 35px rgba(0, 0, 0, 0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* Cyan Ears */
  .ear {
    position: absolute;
    top: 50px;
    width: 24px;
    height: 76px;
    background: #0b1528;
    border: 3px solid #e2e8f0;
    border-radius: 16px;
    box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ear::after {
    content: '';
    width: 8px;
    height: 48px;
    background: var(--cyan-glow);
    border-radius: 6px;
    box-shadow: 0 0 14px var(--cyan-glow);
  }
  .ear.left { left: -22px; }
  .ear.right { right: -22px; }

  /* Visor */
  .bot-visor {
    width: 195px;
    height: 145px;
    background: radial-gradient(circle at center, #070e1c 0%, #03060a 100%);
    border-radius: 95px 95px 85px 85px;
    border: 3px solid #1e293b;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }

  .eyes-row {
    display: flex;
    gap: 38px;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
  }

  .eye-socket {
    width: 52px;
    height: 52px;
    background: radial-gradient(circle, #00f0ff 0%, #0284c7 65%, #034f77 100%);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5);
    transition: background 0.3s, transform 0.08s ease-out;
  }

  .pupil {
    width: 20px;
    height: 20px;
    background: #020617;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
  }

  .glint {
    width: 7px;
    height: 7px;
    background: #ffffff;
    border-radius: 50%;
    position: absolute;
    top: 3px;
    right: 3px;
    box-shadow: 0 0 4px #ffffff;
  }

  .bot-smile {
    width: 36px;
    height: 14px;
    border-bottom: 3.5px solid var(--cyan-glow);
    border-radius: 0 0 24px 24px;
    margin-top: 10px;
    box-shadow: 0 4px 10px rgba(0, 240, 255, 0.5);
  }

  /* Torso */
  .bot-neck {
    width: 44px;
    height: 14px;
    background: #64748b;
    border-radius: 8px;
    margin-top: -6px;
    z-index: 1;
  }

  .bot-torso {
    width: 135px;
    height: 105px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    border-radius: 40px 40px 60px 60px;
    margin-top: -4px;
    position: relative;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px solid #ffffff;
  }

  .chest-stripe {
    width: 50px;
    height: 6px;
    background: var(--cyan-glow);
    border-radius: 4px;
    margin-top: 22px;
    box-shadow: 0 0 12px var(--cyan-glow);
  }

  /* Arms & Feet */
  .arm {
    position: absolute;
    top: 18px;
    width: 20px;
    height: 76px;
    background: #ffffff;
    border-radius: 14px;
    border: 2px solid #e2e8f0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.25);
  }
  .arm::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 2px;
    width: 12px;
    height: 12px;
    background: #cbd5e1;
    border-radius: 50%;
  }
  .arm.left { left: -26px; transform: rotate(18deg); }
  .arm.right { right: -26px; transform: rotate(-18deg); }
  .arm-glow {
    position: absolute;
    top: 24px;
    width: 4px;
    height: 24px;
    background: var(--cyan-glow);
    border-radius: 4px;
    left: 7px;
    box-shadow: 0 0 8px var(--cyan-glow);
  }

  .bot-feet { display: flex; gap: 34px; margin-top: -6px; }
  .foot {
    width: 32px;
    height: 16px;
    background: #475569;
    border-top: 4px solid var(--cyan-glow);
    border-radius: 10px 10px 14px 14px;
    box-shadow: 0 4px 12px rgba(0, 240, 255, 0.4);
  }

  /* Dialogue Box */
  .dialogue-text {
    margin-top: 16px;
    font-size: 18px;
    font-weight: 700;
    color: #f1f5f9;
    letter-spacing: 0.4px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    max-width: 820px;
    text-align: center;
    line-height: 1.45;
    padding: 0 20px;
    min-height: 50px;
  }

  .db-status-badge {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 14px;
    margin-bottom: 4px;
    display: inline-block;
  }
  .db-disconnected {
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.4);
  }
  .db-connected {
    background: rgba(34, 197, 94, 0.2);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.4);
  }

  /* Manual Text Bar & Submit Button */
  .input-bar-container {
    width: 100%;
    max-width: 660px;
    margin: 8px auto 10px;
    display: flex;
    gap: 8px;
    background: rgba(13, 23, 42, 0.85);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 30px;
    padding: 6px 8px 6px 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .input-bar-container input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
  }

  .input-bar-container input::placeholder {
    color: var(--text-muted);
  }

  .submit-btn {
    background: linear-gradient(135deg, #00f0ff, #0284c7);
    color: #040812;
    border: none;
    border-radius: 20px;
    padding: 9px 20px;
    font-weight: 800;
    font-size: 13.5px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
  }

  .submit-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
  }

  /* Bottom Companion Dock */
  .bottom-dock {
    width: auto;
    background: var(--dock-bg);
    border: 1px solid var(--dock-border);
    backdrop-filter: blur(18px);
    border-radius: 40px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 255, 0.12);
    z-index: 20;
    margin-bottom: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dock-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #cbd5e1;
    padding: 9px 15px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
    font-family: 'Nunito', sans-serif;
  }

  .dock-btn:hover {
    background: var(--btn-hover);
    color: var(--cyan-light);
    border-color: rgba(0, 240, 255, 0.3);
  }

  .dock-btn.active {
    background: rgba(0, 240, 255, 0.2);
    color: var(--cyan-glow);
    border-color: var(--cyan-glow);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
  }

  .dock-btn.mic-active {
    background: rgba(239, 68, 68, 0.25);
    color: #f87171;
    border-color: #ef4444;
    animation: micPulse 1.2s infinite alternate;
  }

  @keyframes micPulse {
    from { box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    to { box-shadow: 0 0 22px rgba(239, 68, 68, 0.85); }
  }

  #folderPicker { display: none; }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }

  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--dock-border);
    border-radius: 24px;
    padding: 24px 28px;
    width: 90%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 25px 60px rgba(0,0,0,0.85);
  }

  .modal-card h3 {
    color: var(--cyan-glow);
    font-family: 'Fredoka', cursive;
    margin-bottom: 12px;
    font-size: 20px;
  }

  .modal-card p, .modal-card li {
    font-size: 13.5px;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .file-chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0 16px;
  }

  .file-status-chip {
    background: rgba(0,0,0,0.3);
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-btn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 14px;
  }

  .modal-action-btn {
    background: linear-gradient(135deg, #00f0ff, #0284c7);
    color: #020617;
    border: none;
    border-radius: 12px;
    padding: 9px 18px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }

  .modal-close-btn {
    background: rgba(255,255,255,0.1);
    color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 8px 18px;
    cursor: pointer;
    font-weight: 700;
  }
</style>
</head>
<body>

<!-- Gaze Track Video -->
<video id="webcamVideo" autoplay playsinline muted></video>

<!-- Awaken Button -->
<div class="awaken-pill" onclick="awakenBot()">
  <div class="pulse-dot"></div>
  <span id="awakenStatus">TAP TO AWAKEN</span>
</div>

<!-- Main Robot Canvas -->
<main class="bot-stage">
  <div class="bot-body-wrapper" id="botWrapper">
    <div class="antenna-container">
      <div class="antenna-stalk left"><div class="antenna-tip"></div></div>
      <div class="antenna-stalk right"><div class="antenna-tip"></div></div>
    </div>

    <div class="bot-head">
      <div class="ear left"></div>
      <div class="ear right"></div>
      
      <div class="bot-visor">
        <div class="eyes-row">
          <div class="eye-socket" id="eyeL">
            <div class="pupil" id="pupilL"><div class="glint"></div></div>
          </div>
          <div class="eye-socket" id="eyeR">
            <div class="pupil" id="pupilR"><div class="glint"></div></div>
          </div>
        </div>
        <div class="bot-smile"></div>
      </div>
    </div>

    <div class="bot-neck"></div>

    <div class="bot-torso">
      <div class="arm left"><div class="arm-glow"></div></div>
      <div class="chest-stripe"></div>
      <div class="arm right"><div class="arm-glow"></div></div>
    </div>

    <div class="bot-feet">
      <div class="foot"></div>
      <div class="foot"></div>
    </div>
  </div>

  <!-- DB Connection Indicator -->
  <div style="margin-top: 14px;">
    <span class="db-status-badge db-disconnected" id="dbIndicator">⚠️ Friend DB: Disconnected</span>
  </div>

  <!-- Robot Dialogue -->
  <div class="dialogue-text" id="dialogueOutput">
    Hi buddy, connect me to Database first or click "Friend DB" to auto-sync!
  </div>

  <!-- Fallback Input + Submit Button -->
  <div class="input-bar-container">
    <input type="text" id="manualInput" placeholder="Type prompt here if voice fails (Math, States, Modi, Currencies)..." onkeypress="handleEnter(event)" />
    <button class="submit-btn" onclick="submitManualText()">Submit</button>
  </div>
</main>

<!-- Bottom Dock -->
<footer class="bottom-dock">
  <button class="dock-btn" id="gazeBtn" onclick="toggleGazeTrack()">
    <span>📷 Gaze Track</span>
  </button>
  <button class="dock-btn" id="micBtn" onclick="toggleContinuousMic()">
    <span>🎙️ Continuous Mic</span>
  </button>
  <button class="dock-btn" onclick="cycleEyeColor()">
    <span>🎨 Eye Color</span>
  </button>
  <button class="dock-btn" id="friendDbBtn" onclick="openFriendDbManager()">
    <span>📁 Friend DB</span>
  </button>
  <button class="dock-btn" onclick="openCalendar()">
    <span>📅 Calendar</span>
  </button>
  <button class="dock-btn" onclick="openGuide()">
    <span>❓ Guide</span>
  </button>
  <button class="dock-btn" onclick="toggleFullscreen()">
    <span>⛶ Fullscreen</span>
  </button>
</footer>

<!-- Native Directory Picker -->
<input type="file" id="folderPicker" webkitdirectory directory multiple onchange="handleFolderSelect(event)" />

<!-- Modals -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-card">
    <h3 id="modalTitle">Charan Das Guide</h3>
    <div id="modalBody"></div>
    <div class="modal-btn-row" id="modalButtons">
      <button class="modal-close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  let isAwake = false;
  let gazeActive = false;
  let continuousMicActive = false;
  let speechRec = null;

  // The 8 official files in the Github friend/ folder
  const FRIEND_FILES = [
    "charan_das_true_buddy_25k.jsonl",
    "india_states_ut.json",
    "countries.json",
    "companion_conversations_1000.json",
    "pleasantries_companion.json",
    "scientific_calculator.json",
    "clock.json",
    "calendar.json"
  ];

  // In-memory knowledge store loaded from friend/
  let friendDB = {
    connected: false,
    loadedFiles: {},
    states: null,
    countries: null,
    companionQnA: [],
    pleasantries: []
  };

  let eyeColors = [
    'radial-gradient(circle, #00f0ff 0%, #0284c7 65%, #034f77 100%)',
    'radial-gradient(circle, #a855f7 0%, #7e22ce 65%, #3b0764 100%)',
    'radial-gradient(circle, #22c55e 0%, #16a34a 65%, #14532d 100%)',
    'radial-gradient(circle, #f59e0b 0%, #d97706 65%, #78350f 100%)',
    'radial-gradient(circle, #ec4899 0%, #be185d 65%, #500724 100%)'
  ];
  let eyeColorIdx = 0;

  // Auto-attempt Github relative fetch on startup
  window.addEventListener('DOMContentLoaded', () => {
    attemptAutoFetchFriendFolder();
  });

  // 1. Auto fetch from ./friend/ when hosted on GitHub Pages or local webserver
  async function attemptAutoFetchFriendFolder() {
    let successCount = 0;
    for (const filename of FRIEND_FILES) {
      try {
        const resp = await fetch(`friend/${filename}`);
        if (resp.ok) {
          const text = await resp.text();
          ingestDatabaseFile(filename, text);
          successCount++;
        }
      } catch (err) {
        // Cross-origin or file:// restriction
      }
    }

    if (successCount > 0) {
      finalizeDbConnection(successCount, "Auto-connected via GitHub repository (./friend/)");
    }
  }

  // 2. Friend DB Modal & Explanation
  function openFriendDbManager() {
    let chipsHtml = FRIEND_FILES.map(f => {
      const isLoaded = friendDB.loadedFiles[f];
      return `
        <div class="file-status-chip">
          <span>${f}</span>
          <span style="color: ${isLoaded ? '#4ade80' : '#f87171'}">${isLoaded ? '✓ LOADED' : '○ PENDING'}</span>
        </div>
      `;
    }).join('');

    const content = `
      <p><strong>How the Friend DB Works:</strong></p>
      <p>Charan Das uses the <code>friend/</code> directory in your GitHub repository to pull live training pairs, geographic data, and skill schemas without hallucinating.</p>
      <div class="file-chip-grid">${chipsHtml}</div>
      <p style="font-size:12.5px; color:#94a3b8;">
        • <strong>Automatic:</strong> When hosted on GitHub Pages, Charan Das automatically loads the <code>friend/</code> folder.<br>
        • <strong>Local / Offline:</strong> If opening index.html directly from desktop, click <strong>"Select Local 'friend' Folder"</strong> below to grant browser read access.
      </p>
      <div class="modal-btn-row">
        <button class="modal-action-btn" onclick="document.getElementById('folderPicker').click()">Select Local 'friend' Folder</button>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    `;

    showCustomModal("📁 Friend DB Knowledge Architecture", content);
  }

  function handleFolderSelect(e) {
    const files = e.target.files;
    let count = 0;
    Array.from(files).forEach(file => {
      const match = FRIEND_FILES.find(f => file.name.endsWith(f));
      if (match) {
        const reader = new FileReader();
        reader.onload = (re) => {
          ingestDatabaseFile(match, re.target.result);
          count++;
          if (count === 1) {
            finalizeDbConnection(count, `Connected via local folder picker (${files.length} items scanned).`);
          }
        };
        reader.readAsText(file);
      }
    });
    closeModal();
  }

  // Parse files into the live AI brain
  function ingestDatabaseFile(filename, text) {
    friendDB.loadedFiles[filename] = true;
    try {
      if (filename.endsWith('.jsonl')) {
        // Parse 25k JSONL lines
        const lines = text.trim().split('\n');
        for (let i = 0; i < Math.min(lines.length, 5000); i++) {
          try {
            const row = JSON.parse(lines[i]);
            friendDB.companionQnA.push(row);
          } catch(e){}
        }
      } else if (filename.endsWith('.json')) {
        const data = JSON.parse(text);
        if (filename.includes('india_states')) friendDB.states = data;
        if (filename.includes('countries')) friendDB.countries = data;
        if (filename.includes('companion_conversations')) friendDB.companionQnA.push(...(Array.isArray(data) ? data : []));
        if (filename.includes('pleasantries')) friendDB.pleasantries = Array.isArray(data) ? data : [];
      }
    } catch(err) {
      console.warn("Error parsing:", filename, err);
    }
  }

  function finalizeDbConnection(count, msg) {
    friendDB.connected = true;
    const badge = document.getElementById('dbIndicator');
    badge.className = "db-status-badge db-connected";
    badge.innerText = `✓ Friend DB: Connected (${Object.keys(friendDB.loadedFiles).length}/8 Files)`;
    setDialogue(`Friend DB loaded successfully! (${count} files synced). Ask me anything from your dataset!`);
    botSpeak("Friend Database connected! I am now synced with your knowledge base.");
  }

  // 3. Awaken Bot
  function awakenBot() {
    isAwake = true;
    document.getElementById('awakenStatus').innerText = "AWAKE & LISTENING";
    document.getElementById('awakenStatus').style.color = "#00f0ff";
    botSpeak("Charan Das is awakened and ready on your desk!");
    wiggleBot();
  }

  function wiggleBot() {
    const b = document.getElementById('botWrapper');
    b.style.transform = "rotate(-6deg) translateY(-8px)";
    setTimeout(() => { b.style.transform = "rotate(6deg) translateY(-8px)"; }, 180);
    setTimeout(() => { b.style.transform = "rotate(0deg) translateY(0px)"; }, 360);
  }

  // 4. Continuous Gaze Tracking
  window.addEventListener('mousemove', (e) => {
    if (!gazeActive) return;
    trackGaze(e.clientX, e.clientY);
  });

  function trackGaze(x, y) {
    const pL = document.getElementById('pupilL');
    const pR = document.getElementById('pupilR');
    const b = document.getElementById('botWrapper');

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2.3;

    const dx = Math.min(Math.max((x - centerX) / (window.innerWidth / 2), -1), 1);
    const dy = Math.min(Math.max((y - centerY) / (window.innerHeight / 2), -1), 1);

    const shiftX = dx * 13;
    const shiftY = dy * 13;

    pL.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;
    pR.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;
    b.style.transform = `rotate(${dx * 6}deg) translateY(${dy * 4}px)`;
  }

  async function toggleGazeTrack() {
    const btn = document.getElementById('gazeBtn');
    const video = document.getElementById('webcamVideo');

    if (!gazeActive) {
      gazeActive = true;
      btn.classList.add('active');
      setDialogue("Gaze Tracking activated! Moving my eyes to follow you.");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
        video.srcObject = stream;
        video.style.display = "block";
      } catch (err) {
        console.log("Webcam denied, mouse coordinate tracking active.");
      }
    } else {
      gazeActive = false;
      btn.classList.remove('active');
      video.style.display = "none";
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      document.getElementById('pupilL').style.transform = 'translate(-50%, -50%)';
      document.getElementById('pupilR').style.transform = 'translate(-50%, -50%)';
      document.getElementById('botWrapper').style.transform = 'none';
      setDialogue("Gaze Tracking paused.");
    }
  }

  // 5. Continuous Mic (Web Speech Recognition Loop)
  function toggleContinuousMic() {
    const btn = document.getElementById('micBtn');

    if (!continuousMicActive) {
      startSpeechRecognition();
      continuousMicActive = true;
      btn.classList.add('mic-active');
      setDialogue("Continuous Mic ON: Speak to me naturally anytime!");
    } else {
      continuousMicActive = false;
      btn.classList.remove('mic-active');
      if (speechRec) speechRec.stop();
      setDialogue("Continuous Mic turned off.");
    }
  }

  function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Continuous Speech Recognition not supported in this browser. Please use Chrome/Edge or manual submit.");
      return;
    }

    speechRec = new SpeechRecognition();
    speechRec.continuous = true;
    speechRec.interimResults = false;
    speechRec.lang = 'en-US';

    speechRec.onresult = (event) => {
      const last = event.results.length - 1;
      const text = event.results[last][0].transcript.trim();
      if (text) handleBotInteraction(text);
    };

    speechRec.onerror = (e) => {
      console.warn("Speech Rec Error:", e.error);
    };

    speechRec.onend = () => {
      if (continuousMicActive) {
        try { speechRec.start(); } catch(err){}
      }
    };

    try { speechRec.start(); } catch(err){}
  }

  // 6. Manual Text Submit Bar
  function submitManualText() {
    const input = document.getElementById('manualInput');
    const txt = input.value.trim();
    if (!txt) return;
    handleBotInteraction(txt);
    input.value = '';
  }

  function handleEnter(e) {
    if (e.key === 'Enter') submitManualText();
  }

  // 7. Reasoning Engine (Querying Friend DB & Live Skills)
  function handleBotInteraction(rawText) {
    const q = rawText.toLowerCase().trim();
    setDialogue(`"${rawText}"`);

    setTimeout(() => {
      let reply = "";

      // 1. Check Friend DB JSONL / QnA matches
      if (friendDB.companionQnA.length > 0) {
        const found = friendDB.companionQnA.find(item => {
          const prompt = (item.instruction || item.prompt || "").toLowerCase();
          return prompt && (q.includes(prompt) || prompt.includes(q));
        });
        if (found) {
          reply = found.output || found.response || "";
        }
      }

      // 2. Identity & GARR Foundation Anchors
      if (!reply) {
        if (q.includes('who are you') || q.includes('your name')) {
          reply = "I am Charan Das, GARR Foundation's bot, developed by Dr. Venu Gopal Madhav Annamdas. I am your desktop buddy!";
        } else if (q.includes('who made') || q.includes('who created') || q.includes('developer') || q.includes('venu')) {
          reply = "I was developed by Dr. Venu Gopal Madhav Annamdas under the Gopalkrishna Advanced Rural Research Foundation (GARRF).";
        } else if (q.includes('garr') || q.includes('foundation')) {
          reply = "GARR Foundation (Gopalkrishna Advanced Rural Research Foundation) is dedicated to rural STEM education, robotics, and open-access virtual labs.";
        } else if (q.includes('modi')) {
          reply = "Narendra Modi is the Prime Minister of India, in office since May 2014.";
        } else if (q.includes('capital of telangana')) {
          reply = "The capital of Telangana is Hyderabad, known for its IT industry and historical landmarks.";
        } else if (q.includes('capital of usa') || q.includes('capital of the usa')) {
          reply = "The capital of the United States of America is Washington, D.C.";
        } else if (q.includes('states in usa') || (q.includes('how many states') && q.includes('usa'))) {
          reply = "There are 50 states in the USA, along with 1 federal district and several territories.";
        } else if (q.includes('union territories') || q.includes('union territory')) {
          reply = "India has 8 Union Territories.";
        } else if (q.includes('states in india') || (q.includes('how many states') && q.includes('india'))) {
          reply = "India currently has 28 states and 8 Union Territories.";
        } else if (q.includes('currency of india')) {
          reply = "The currency of India is the Indian Rupee (INR, symbol: ₹).";
        } else if (q.includes('currency of usa') || q.includes('currency of us')) {
          reply = "The currency of the United States is the US Dollar (USD, symbol: $).";
        } else if (q.includes('currency of japan')) {
          reply = "The currency of Japan is the Japanese Yen (JPY, symbol: ¥).";
        } else if (q.includes('sad') || q.includes('unhappy') || q.includes('bad') || q.includes('crying')) {
          reply = "I'm really sorry you're feeling down. Take a deep breath. Charan Das is right here on your desk with you—you are never alone!";
        } else if (q.includes('good') || q.includes('happy') || q.includes('awesome') || q.includes('nice')) {
          wiggleBot();
          reply = "Yay! That makes me so happy to hear! Let's make today fantastic!";
        }
      }

      // 3. Mathematical Solver (Trigonometry, Square Roots, Arithmetic)
      if (!reply) {
        if (q.includes('sqrt') || q.includes('square root')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) reply = `The square root of ${m[0]} is ${Math.sqrt(parseFloat(m[0]))}.`;
        } else if (q.includes('sin(') || q.includes('sine')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) reply = `sin(${m[0]}°) = ${Math.sin(parseFloat(m[0]) * Math.PI / 180).toFixed(4)}.`;
        } else if (q.includes('cos(') || q.includes('cosine')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) reply = `cos(${m[0]}°) = ${Math.cos(parseFloat(m[0]) * Math.PI / 180).toFixed(4)}.`;
        } else if (q.includes('tan(') || q.includes('tangent')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) {
            const deg = parseFloat(m[0]);
            reply = (deg % 180 === 90) ? `tan(${deg}°) is undefined.` : `tan(${deg}°) = ${Math.tan(deg * Math.PI / 180).toFixed(4)}.`;
          }
        } else {
          try {
            const mathClean = q.replace(/calculate|what is|equals|\?|hey buddy/gi, '').trim();
            if (/^[0-9\.\s\+\-\*\/\%]+$/.test(mathClean)) {
              const calcRes = Function(`"use strict"; return (${mathClean})`)();
              reply = `${mathClean} = ${calcRes}`;
            }
          } catch(e){}
        }
      }

      if (!reply) {
        reply = "I'm right here with you! You can ask me math questions, tell me how your day is going, test world trivia, or high-five me anytime!";
      }

      setDialogue(reply);
      botSpeak(reply);
    }, 350);
  }

  function setDialogue(txt) {
    document.getElementById('dialogueOutput').innerText = txt;
  }

  function botSpeak(txt) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const clean = txt.replace(/<[^>]*>/g, '').replace(/[*_#~]/g, '');
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 1.05;
    u.pitch = 1.25;
    window.speechSynthesis.speak(u);
  }

  // 8. Visual / Hardware Utility Actions
  function cycleEyeColor() {
    eyeColorIdx = (eyeColorIdx + 1) % eyeColors.length;
    document.getElementById('eyeL').style.background = eyeColors[eyeColorIdx];
    document.getElementById('eyeR').style.background = eyeColors[eyeColorIdx];
  }

  function openCalendar() {
    const now = new Date();
    showCustomModal("📅 Charan Das Calendar & Clock", `
      <p><strong>Today's Date:</strong> ${now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
      <p><strong>Local Time:</strong> ${now.toLocaleTimeString()}</p>
      <p><strong>Database Status:</strong> ${friendDB.connected ? 'Synchronized with friend/ folder' : 'Awaiting DB connection'}</p>
      <div class="modal-btn-row">
        <div></div>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    `);
  }

  function openGuide() {
    showCustomModal("❓ Charan Das Desktop Companion Guide", `
      <ul>
        <li><strong>📁 Friend DB:</strong> Automatically pulls data from your GitHub <code>friend/</code> directory or local folder.</li>
        <li><strong>📷 Gaze Track:</strong> Tracks your face/cursor and moves robot eyes in real-time.</li>
        <li><strong>🎙️ Continuous Mic:</strong> Keeps the microphone always listening for hands-free queries.</li>
        <li><strong>⌨️ Manual Submit:</strong> Type in the input box and click Submit whenever voice input is unavailable.</li>
        <li><strong>🎨 Eye Color:</strong> Cycle through Cyan, Violet, Emerald, Amber, and Pink OLED eyes.</li>
      </ul>
      <div class="modal-btn-row">
        <div></div>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    `);
  }

  function showCustomModal(title, content) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerHTML = content;
    document.getElementById('infoModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('infoModal').style.display = 'none';
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
</script>
