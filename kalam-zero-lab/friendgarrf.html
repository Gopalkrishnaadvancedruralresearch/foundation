<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charan Das - 3D Interactive AI Desktop Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #111d33 0%, #060a12 100%);
    --cyan-glow: #00f0ff;
    --cyan-light: #67e8f9;
    --dock-bg: rgba(13, 23, 42, 0.88);
    --dock-border: rgba(0, 240, 255, 0.28);
    --btn-hover: rgba(0, 240, 255, 0.18);
    --text-main: #f0f6fc;
    --text-muted: #8ca3c7;
    --card-bg: rgba(15, 23, 42, 0.95);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px 10px;
    position: relative;
  }

  /* Hidden Camera Video for Gaze Tracking */
  #webcamVideo {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 130px;
    height: 98px;
    border-radius: 12px;
    border: 2px solid var(--cyan-glow);
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
    z-index: 100;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
  }

  /* Top Capsule */
  .top-bar {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .awaken-pill {
    background: rgba(4, 30, 45, 0.9);
    border: 1px solid rgba(0, 240, 255, 0.4);
    padding: 6px 18px;
    border-radius: 24px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #4ade80;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    cursor: pointer;
    transition: all 0.3s;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 10px #22c55e;
    animation: pulseBlink 1.5s infinite ease-in-out;
  }

  @keyframes pulseBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  .db-status-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 12px;
    border-radius: 14px;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.35);
  }

  /* Main 3D Interactive Stage */
  .bot-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    flex: 1;
    width: 100%;
    perspective: 1000px;
    cursor: grab;
  }

  .bot-stage:active {
    cursor: grabbing;
  }

  /* 3D Transform Pivot */
  .bot-3d-scene {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.08s ease-out;
  }

  /* The Robot Chassis */
  .bot-body-wrapper {
    position: relative;
    width: 300px;
    height: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 15px 35px rgba(0, 240, 255, 0.22));
    transform-origin: center bottom;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Jumping animation */
  .bot-body-wrapper.jumping {
    animation: jumpAction 0.75s cubic-bezier(0.28, 0.84, 0.42, 1);
  }

  @keyframes jumpAction {
    0% { transform: translateY(0) scale(1, 1); }
    25% { transform: translateY(-75px) scale(0.92, 1.08); }
    55% { transform: translateY(-90px) scale(0.96, 1.04); }
    80% { transform: translateY(0) scale(1.08, 0.92); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  /* Antenna */
  .antenna-container {
    display: flex;
    justify-content: space-between;
    width: 160px;
    margin-bottom: -14px;
    z-index: 1;
  }

  .antenna-stalk {
    width: 7px;
    height: 38px;
    background: #64748b;
    border-radius: 4px;
    position: relative;
  }
  .antenna-stalk.left { transform: rotate(-28deg); transform-origin: bottom center; }
  .antenna-stalk.right { transform: rotate(28deg); transform-origin: bottom center; }
  
  .antenna-tip {
    width: 15px;
    height: 15px;
    background: var(--cyan-glow);
    border-radius: 50%;
    position: absolute;
    top: -9px;
    left: -4px;
    box-shadow: 0 0 18px var(--cyan-glow);
    animation: tipGlow 2s infinite alternate;
  }

  @keyframes tipGlow {
    from { box-shadow: 0 0 10px var(--cyan-glow); }
    to { box-shadow: 0 0 24px var(--cyan-glow), 0 0 35px #38bdf8; }
  }

  /* Head */
  .bot-head {
    width: 235px;
    height: 185px;
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 75%, #cbd5e1 100%);
    border-radius: 115px 115px 100px 100px;
    border: 5px solid #ffffff;
    box-shadow: 
      inset 0 6px 12px rgba(255, 255, 255, 0.9),
      inset 0 -10px 20px rgba(100, 116, 139, 0.35),
      0 12px 30px rgba(0, 0, 0, 0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: transform 0.2s ease;
  }

  .ear {
    position: absolute;
    top: 45px;
    width: 22px;
    height: 72px;
    background: #0b1528;
    border: 3px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ear::after {
    content: '';
    width: 7px;
    height: 44px;
    background: var(--cyan-glow);
    border-radius: 5px;
    box-shadow: 0 0 12px var(--cyan-glow);
  }
  .ear.left { left: -20px; }
  .ear.right { right: -20px; }

  /* Visor */
  .bot-visor {
    width: 185px;
    height: 135px;
    background: radial-gradient(circle at center, #070e1c 0%, #03060a 100%);
    border-radius: 90px 90px 80px 80px;
    border: 3px solid #1e293b;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }

  .eyes-row {
    display: flex;
    gap: 34px;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
  }

  .eye-socket {
    width: 48px;
    height: 48px;
    background: radial-gradient(circle, #00f0ff 0%, #0284c7 65%, #034f77 100%);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 22px rgba(0, 240, 255, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.5);
    transition: background 0.3s, transform 0.15s ease-out;
  }

  .pupil {
    width: 18px;
    height: 18px;
    background: #020617;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.12s ease-out;
  }

  .glint {
    width: 6px;
    height: 6px;
    background: #ffffff;
    border-radius: 50%;
    position: absolute;
    top: 3px;
    right: 3px;
    box-shadow: 0 0 4px #ffffff;
  }

  .bot-smile {
    width: 32px;
    height: 12px;
    border-bottom: 3.5px solid var(--cyan-glow);
    border-radius: 0 0 20px 20px;
    margin-top: 8px;
    box-shadow: 0 4px 10px rgba(0, 240, 255, 0.5);
    transition: all 0.3s;
  }

  .bot-neck {
    width: 40px;
    height: 12px;
    background: #64748b;
    border-radius: 6px;
    margin-top: -5px;
    z-index: 1;
  }

  .bot-torso {
    width: 128px;
    height: 98px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    border-radius: 36px 36px 55px 55px;
    margin-top: -3px;
    position: relative;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px solid #ffffff;
  }

  .chest-stripe {
    width: 48px;
    height: 6px;
    background: var(--cyan-glow);
    border-radius: 4px;
    margin-top: 20px;
    box-shadow: 0 0 10px var(--cyan-glow);
  }

  /* Arms with Hands Up capability */
  .arm {
    position: absolute;
    top: 16px;
    width: 18px;
    height: 72px;
    background: #ffffff;
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    box-shadow: 0 5px 12px rgba(0,0,0,0.22);
    transform-origin: top center;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .arm::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 2px;
    width: 11px;
    height: 11px;
    background: #cbd5e1;
    border-radius: 50%;
  }
  .arm.left { left: -24px; transform: rotate(18deg); }
  .arm.right { right: -24px; transform: rotate(-18deg); }
  
  /* Hands Up Class */
  .hands-up .arm.left {
    transform: rotate(155deg) !important;
  }
  .hands-up .arm.right {
    transform: rotate(-155deg) !important;
  }

  .arm-glow {
    position: absolute;
    top: 22px;
    width: 4px;
    height: 22px;
    background: var(--cyan-glow);
    border-radius: 3px;
    left: 6px;
    box-shadow: 0 0 8px var(--cyan-glow);
  }

  .bot-feet { display: flex; gap: 32px; margin-top: -6px; }
  .foot {
    width: 30px;
    height: 15px;
    background: #475569;
    border-top: 4px solid var(--cyan-glow);
    border-radius: 8px 8px 12px 12px;
    box-shadow: 0 4px 10px rgba(0, 240, 255, 0.4);
  }

  /* 3D Interactive Controls Helper */
  .orbit-hint {
    position: absolute;
    bottom: 2px;
    font-size: 11px;
    color: var(--text-muted);
    background: rgba(0,0,0,0.3);
    padding: 3px 10px;
    border-radius: 12px;
    pointer-events: none;
  }

  /* UNIFIED DIALOGUE BOX (Question + Answer Displayed Together in Smaller Font) */
  .dialogue-card-container {
    width: 100%;
    max-width: 680px;
    background: rgba(13, 23, 42, 0.92);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 14px;
    padding: 10px 16px;
    margin-top: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .dialogue-row {
    font-size: 13.5px;
    line-height: 1.45;
    word-break: break-word;
  }

  .dialogue-row .q-tag {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: #67e8f9;
    margin-right: 6px;
  }

  .dialogue-row .re-tag {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: #4ade80;
    margin-right: 6px;
  }

  .dialogue-row.query {
    color: #94a3b8;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    padding-bottom: 5px;
  }

  .dialogue-row.reply {
    color: #f1f5f9;
  }

  /* Manual Text Bar & Submit Button */
  .input-bar-container {
    width: 100%;
    max-width: 680px;
    margin: 8px auto 6px;
    display: flex;
    gap: 8px;
    background: rgba(13, 23, 42, 0.88);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 28px;
    padding: 5px 6px 5px 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }

  .input-bar-container input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
  }

  .input-bar-container input::placeholder {
    color: var(--text-muted);
  }

  .submit-btn {
    background: linear-gradient(135deg, #00f0ff, #0284c7);
    color: #040812;
    border: none;
    border-radius: 20px;
    padding: 7px 18px;
    font-weight: 800;
    font-size: 12.5px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
  }

  .submit-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
  }

  /* Bottom Companion Capsule Dock */
  .bottom-dock {
    width: auto;
    background: var(--dock-bg);
    border: 1px solid var(--dock-border);
    backdrop-filter: blur(16px);
    border-radius: 36px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.1);
    z-index: 20;
    margin-bottom: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dock-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #cbd5e1;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    font-family: 'Nunito', sans-serif;
  }

  .dock-btn:hover {
    background: var(--btn-hover);
    color: var(--cyan-light);
    border-color: rgba(0, 240, 255, 0.3);
  }

  .dock-btn.active {
    background: rgba(0, 240, 255, 0.2);
    color: var(--cyan-glow);
    border-color: var(--cyan-glow);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
  }

  .dock-btn.mic-active {
    background: rgba(239, 68, 68, 0.25);
    color: #f87171;
    border-color: #ef4444;
    animation: micPulse 1.2s infinite alternate;
  }

  @keyframes micPulse {
    from { box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    to { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
  }

  #folderPicker { display: none; }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }

  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--dock-border);
    border-radius: 20px;
    padding: 22px 24px;
    width: 90%;
    max-width: 540px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 25px 60px rgba(0,0,0,0.85);
  }

  .modal-card h3 {
    color: var(--cyan-glow);
    font-family: 'Fredoka', cursive;
    margin-bottom: 10px;
    font-size: 18px;
  }

  .modal-card p, .modal-card li {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .file-chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 10px 0 14px;
  }

  .file-status-chip {
    background: rgba(0,0,0,0.3);
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-btn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 12px;
  }

  .modal-action-btn {
    background: linear-gradient(135deg, #00f0ff, #0284c7);
    color: #020617;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 12.5px;
  }

  .modal-close-btn {
    background: rgba(255,255,255,0.1);
    color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 7px 16px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
  }
</style>
</head>
<body>

<video id="webcamVideo" autoplay playsinline muted></video>

<div class="top-bar">
  <div class="awaken-pill" onclick="awakenBot()">
    <div class="pulse-dot"></div>
    <span id="awakenStatus">TAP TO AWAKEN</span>
  </div>
  <span class="db-status-badge" id="dbIndicator">Friend DB: Ready</span>
</div>

<main class="bot-stage" id="dragStage">
  <div class="bot-3d-scene" id="botScene">
    <div class="bot-body-wrapper" id="botWrapper">
      <div class="antenna-container">
        <div class="antenna-stalk left"><div class="antenna-tip"></div></div>
        <div class="antenna-stalk right"><div class="antenna-tip"></div></div>
      </div>

      <div class="bot-head" id="botHead">
        <div class="ear left"></div>
        <div class="ear right"></div>
        
        <div class="bot-visor">
          <div class="eyes-row">
            <div class="eye-socket" id="eyeL">
              <div class="pupil" id="pupilL"><div class="glint"></div></div>
            </div>
            <div class="eye-socket" id="eyeR">
              <div class="pupil" id="pupilR"><div class="glint"></div></div>
            </div>
          </div>
          <div class="bot-smile" id="botMouth"></div>
        </div>
      </div>

      <div class="bot-neck"></div>

      <div class="bot-torso" id="botTorso">
        <div class="arm left"><div class="arm-glow"></div></div>
        <div class="chest-stripe"></div>
        <div class="arm right"><div class="arm-glow"></div></div>
      </div>

      <div class="bot-feet">
        <div class="foot"></div>
        <div class="foot"></div>
      </div>
    </div>
  </div>

  <div class="orbit-hint">🖱️ Drag to rotate • Scroll to zoom • Double-click to re-center</div>

  <!-- COMBINED QUESTION & ANSWER DISPLAY BOX (Smaller Font) -->
  <div class="dialogue-card-container">
    <div class="dialogue-row query" id="queryRow">
      <span class="q-tag">Q)</span> <span id="queryText">System Check</span>
    </div>
    <div class="dialogue-row reply" id="replyRow">
      <span class="re-tag">Re)</span> <span id="replyText">Hi buddy, connect me to Database first! Click "📁 Friend DB" below to link my knowledge base before we begin.</span>
    </div>
  </div>

  <!-- Manual Input Box + Submit Button -->
  <div class="input-bar-container">
    <input type="text" id="manualInput" placeholder="Ask: 'can you jump', 'hands up', 'capital of india', 'how was your day'..." onkeypress="handleEnter(event)" />
    <button class="submit-btn" onclick="submitManualText()">Submit</button>
  </div>
</main>

<footer class="bottom-dock">
  <button class="dock-btn" id="gazeBtn" onclick="toggleGazeTrack()">
    <span>📷 Gaze Track</span>
  </button>
  <button class="dock-btn" id="micBtn" onclick="toggleContinuousMic()">
    <span>🎙️ Continuous Mic</span>
  </button>
  <button class="dock-btn" onclick="cycleEyeColor()">
    <span>🎨 Eye Color</span>
  </button>
  <button class="dock-btn" onclick="triggerJump()">
    <span>🦘 Jump</span>
  </button>
  <button class="dock-btn" onclick="toggleHandsUp()">
    <span>🙌 Hands Up</span>
  </button>
  <button class="dock-btn" id="friendDbBtn" onclick="openFriendDbManager()">
    <span>📁 Connect Friend DB</span>
  </button>
  <button class="dock-btn" onclick="openCalendar()">
    <span>📅 Calendar</span>
  </button>
  <button class="dock-btn" onclick="reset3DView()"><span>🔄 Re-center</span></button>
  <button class="dock-btn" onclick="toggleFullscreen()">
    <span>⛶ Fullscreen</span>
  </button>
</footer>

<input type="file" id="folderPicker" webkitdirectory directory multiple onchange="handleFolderSelect(event)" />

<div class="modal-overlay" id="infoModal">
  <div class="modal-card">
    <h3 id="modalTitle">Charan Das Guide</h3>
    <div id="modalBody"></div>
    <div class="modal-btn-row" id="modalButtons">
      <button class="modal-close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  let isAwake = false;
  let gazeActive = false;
  let continuousMicActive = false;
  let speechRec = null;
  let areHandsUp = false;

  let isEyesClosed = false;
  let isSpeaking = false;
  let talkAnimationInterval = null;

  // Eye Control Functions
  function closeEyes(forced = true) {
    isEyesClosed = forced;
    const sL = document.getElementById('eyeL');
    const sR = document.getElementById('eyeR');
    if (isEyesClosed) {
      sL.style.transform = 'scaleY(0.08)';
      sR.style.transform = 'scaleY(0.08)';
    } else {
      sL.style.transform = 'scaleY(1)';
      sR.style.transform = 'scaleY(1)';
    }
  }

  function winkEye(side = 'right') {
    const target = side === 'left' ? document.getElementById('eyeL') : document.getElementById('eyeR');
    const other = side === 'left' ? document.getElementById('eyeR') : document.getElementById('eyeL');
    
    // Wink one eye while keeping the other wide open

  // Real-time Optical Presence Detector (FaceDetector API + Pixel Contrast Variance)
  async function detectUserPresence(videoElement) {
    if (!videoElement || videoElement.videoWidth === 0) {
      return { detected: false };
    }

    // 1. Native Hardware FaceDetector API (Built-in Chromium/Edge feature)
    if ('FaceDetector' in window) {
      try {
        const detector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
        const faces = await detector.detect(videoElement);
        if (faces && faces.length > 0) {
          return { detected: true, method: 'face' };
        }
      } catch(err) {
        // Fallback to optical frame analysis if FaceDetector flag is restricted
      }
    }

    // 2. Optical Center-Frame Motion/Luminance & Edge Density Analysis
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 48;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, 64, 48);
      const imgData = ctx.getImageData(0, 0, 64, 48).data;

      let sumLum = 0;
      let centerLum = 0;
      let centerCount = 0;
      let centerDiff = 0;

      // Focus on central 50% where a person sits
      for (let y = 12; y < 36; y++) {
        for (let x = 16; x < 48; x++) {
          const idx = (y * 64 + x) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          centerLum += lum;
          centerCount++;
        }
      }
      const avgCenter = centerLum / centerCount;

      // Calculate contrast variance in center
      for (let y = 12; y < 36; y++) {
        for (let x = 16; x < 48; x++) {
          const idx = (y * 64 + x) * 4;
          const lum = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
          centerDiff += Math.abs(lum - avgCenter);
        }
      }
      const variance = centerDiff / centerCount;

      // If camera is covered, pointing at flat ceiling, or empty uniform background
      if (avgCenter > 25 && variance > 16) {
        return { detected: true, method: 'contrast' };
      }
      return { detected: false, method: 'contrast' };
    } catch(e) {
      return { detected: true }; // Graceful fallback
    }
  }

  function botSpeak(txt) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const clean = txt.replace(/<[^>]*>/g, '').replace(/[*_#~]/g, '');
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 1.05;
    u.pitch = 1.25;

    // Speech-Synchronized Blinking & Mouth Articulation
    u.onstart = () => {
      isSpeaking = true;
      const mouth = document.getElementById('botMouth');
      talkAnimationInterval = setInterval(() => {
        if (!isEyesClosed) {
          // Micro-blink rhythm while speaking
          if (Math.random() > 0.45) naturalBlink();
        }
        // Mouth expressive movement
        mouth.style.transform = (mouth.style.transform === 'scaleY(1.5)') ? 'scaleY(0.8)' : 'scaleY(1.5)';
      }, 260);
    };

    u.onend = () => {
      isSpeaking = false;
      clearInterval(talkAnimationInterval);
      const mouth = document.getElementById('botMouth');
      mouth.style.transform = 'scaleY(1)';
    };

    window.speechSynthesis.speak(u);
  }

  function cycleEyeColor() {
    eyeColorIdx = (eyeColorIdx + 1) % eyeColors.length;
    document.getElementById('eyeL').style.background = eyeColors[eyeColorIdx];
    document.getElementById('eyeR').style.background = eyeColors[eyeColorIdx];
  }

  function openCalendar() {
    const now = new Date();
    showCustomModal("📅 Charan Das Calendar & Clock", `
      <p><strong>Today's Date:</strong> ${now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
      <p><strong>Local Time:</strong> ${now.toLocaleTimeString()}</p>
      <p><strong>Companion Status:</strong> Online, Active & Listening.</p>
      <div class="modal-btn-row">
        <div></div>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    `);
  }

  function openFriendDbManager() {
    const content = `
      <p><strong>Friend DB Sync:</strong></p>
      <p>Charan Das syncs with your <code>friend/</code> directory for zero-hallucination queries.</p>
      <div class="modal-btn-row">
        <button class="modal-action-btn" onclick="document.getElementById('folderPicker').click()">Select Local 'friend' Folder</button>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    `;
    showCustomModal("📁 Friend DB Knowledge Architecture", content);
  }

  function handleFolderSelect(e) {
    closeModal();
    displayQA("Friend DB", "Local friend database files linked successfully!");
    botSpeak("Friend database synchronized!");
  }

  function showCustomModal(title, content) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerHTML = content;
    document.getElementById('infoModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('infoModal').style.display = 'none';
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
</script>
</body>
</html>
