<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charan Das - AI Desktop Buddy & Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #111d33 0%, #060a12 100%);
    --cyan-glow: #00f0ff;
    --cyan-light: #67e8f9;
    --dock-bg: rgba(13, 23, 42, 0.75);
    --dock-border: rgba(0, 240, 255, 0.22);
    --btn-hover: rgba(0, 240, 255, 0.15);
    --text-main: #f0f6fc;
    --text-muted: #8ca3c7;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 20px 20px;
    position: relative;
  }

  /* Hidden Camera Video for Gaze Face Tracking */
  #webcamVideo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 140px;
    height: 105px;
    border-radius: 12px;
    border: 2px solid var(--cyan-glow);
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
    z-index: 100;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }

  /* Top Awaken Capsule */
  .awaken-pill {
    background: rgba(4, 30, 45, 0.85);
    border: 1px solid rgba(0, 240, 255, 0.35);
    padding: 9px 24px;
    border-radius: 30px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #4ade80;
    text-transform: uppercase;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    cursor: pointer;
    transition: all 0.3s;
    z-index: 10;
  }

  .awaken-pill:hover {
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    border-color: var(--cyan-glow);
  }

  .pulse-dot {
    width: 9px;
    height: 9px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 12px #22c55e;
    animation: pulseBlink 1.5s infinite ease-in-out;
  }

  @keyframes pulseBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  /* Main Robot Stage */
  .bot-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    flex: 1;
    margin-top: -10px;
  }

  /* Cute Animated Bot Graphic */
  .bot-body-wrapper {
    position: relative;
    width: 320px;
    height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 15px 35px rgba(0, 240, 255, 0.2));
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.4, 1);
  }

  /* Antenna Glow Points */
  .antenna-container {
    display: flex;
    justify-content: space-between;
    width: 170px;
    margin-bottom: -14px;
    z-index: 1;
  }

  .antenna-stalk {
    width: 8px;
    height: 42px;
    background: #64748b;
    border-radius: 4px;
    position: relative;
  }
  .antenna-stalk.left {
    transform: rotate(-28deg);
    transform-origin: bottom center;
  }
  .antenna-stalk.right {
    transform: rotate(28deg);
    transform-origin: bottom center;
  }
  .antenna-tip {
    width: 16px;
    height: 16px;
    background: var(--cyan-glow);
    border-radius: 50%;
    position: absolute;
    top: -10px;
    left: -4px;
    box-shadow: 0 0 20px var(--cyan-glow);
    animation: tipGlow 2s infinite alternate;
  }

  @keyframes tipGlow {
    from { box-shadow: 0 0 10px var(--cyan-glow); }
    to { box-shadow: 0 0 26px var(--cyan-glow), 0 0 40px #38bdf8; }
  }

  /* Robot Head */
  .bot-head {
    width: 250px;
    height: 200px;
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 75%, #cbd5e1 100%);
    border-radius: 120px 120px 105px 105px;
    border: 5px solid #ffffff;
    box-shadow: 
      inset 0 6px 12px rgba(255, 255, 255, 0.9),
      inset 0 -10px 20px rgba(100, 116, 139, 0.35),
      0 12px 35px rgba(0, 0, 0, 0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* Cyan Ears */
  .ear {
    position: absolute;
    top: 50px;
    width: 24px;
    height: 80px;
    background: #0b1528;
    border: 3px solid #e2e8f0;
    border-radius: 16px;
    box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ear::after {
    content: '';
    width: 8px;
    height: 50px;
    background: var(--cyan-glow);
    border-radius: 6px;
    box-shadow: 0 0 14px var(--cyan-glow);
  }
  .ear.left { left: -22px; }
  .ear.right { right: -22px; }

  /* Visor / Face */
  .bot-visor {
    width: 200px;
    height: 150px;
    background: radial-gradient(circle at center, #070e1c 0%, #03060a 100%);
    border-radius: 95px 95px 85px 85px;
    border: 3px solid #1e293b;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }

  /* Big Cute Gaze-Tracked Eyes */
  .eyes-row {
    display: flex;
    gap: 40px;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }

  .eye-socket {
    width: 54px;
    height: 54px;
    background: radial-gradient(circle, #00f0ff 0%, #0284c7 65%, #034f77 100%);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5);
    transition: background 0.3s, transform 0.08s ease-out;
  }

  .pupil {
    width: 20px;
    height: 20px;
    background: #020617;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
  }

  .glint {
    width: 7px;
    height: 7px;
    background: #ffffff;
    border-radius: 50%;
    position: absolute;
    top: 3px;
    right: 3px;
    box-shadow: 0 0 4px #ffffff;
  }

  .bot-smile {
    width: 38px;
    height: 14px;
    border-bottom: 3.5px solid var(--cyan-glow);
    border-radius: 0 0 24px 24px;
    margin-top: 12px;
    box-shadow: 0 4px 10px rgba(0, 240, 255, 0.5);
  }

  /* Neck and Torso */
  .bot-neck {
    width: 44px;
    height: 16px;
    background: #64748b;
    border-radius: 8px;
    margin-top: -6px;
    z-index: 1;
  }

  .bot-torso {
    width: 140px;
    height: 110px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    border-radius: 40px 40px 60px 60px;
    margin-top: -4px;
    position: relative;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px solid #ffffff;
  }

  .chest-stripe {
    width: 55px;
    height: 7px;
    background: var(--cyan-glow);
    border-radius: 4px;
    margin-top: 24px;
    box-shadow: 0 0 12px var(--cyan-glow);
  }

  /* Arms & Legs */
  .arm {
    position: absolute;
    top: 20px;
    width: 22px;
    height: 80px;
    background: #ffffff;
    border-radius: 14px;
    border: 2px solid #e2e8f0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.25);
  }
  .arm::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: #cbd5e1;
    border-radius: 50%;
  }
  .arm.left {
    left: -28px;
    transform: rotate(18deg);
  }
  .arm.right {
    right: -28px;
    transform: rotate(-18deg);
  }
  .arm-glow {
    position: absolute;
    top: 25px;
    width: 5px;
    height: 25px;
    background: var(--cyan-glow);
    border-radius: 4px;
    left: 7px;
    box-shadow: 0 0 8px var(--cyan-glow);
  }

  .bot-feet {
    display: flex;
    gap: 36px;
    margin-top: -6px;
  }
  .foot {
    width: 34px;
    height: 18px;
    background: #475569;
    border-top: 4px solid var(--cyan-glow);
    border-radius: 10px 10px 14px 14px;
    box-shadow: 0 4px 12px rgba(0, 240, 255, 0.4);
  }

  /* Spoken Bubble / Subtitle */
  .dialogue-text {
    margin-top: 24px;
    font-size: 19px;
    font-weight: 700;
    color: #e2e8f0;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    max-width: 780px;
    text-align: center;
    line-height: 1.45;
    padding: 0 20px;
    min-height: 54px;
  }

  /* Manual Text Fallback & Submit bar */
  .input-bar-container {
    width: 100%;
    max-width: 640px;
    margin: 10px auto 14px;
    display: flex;
    gap: 8px;
    background: rgba(13, 23, 42, 0.85);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 30px;
    padding: 6px 8px 6px 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .input-bar-container input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 14.5px;
  }

  .input-bar-container input::placeholder {
    color: var(--text-muted);
  }

  .submit-btn {
    background: linear-gradient(135deg, #00f0ff, #0284c7);
    color: #040812;
    border: none;
    border-radius: 20px;
    padding: 9px 20px;
    font-weight: 800;
    font-size: 13.5px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
  }

  .submit-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
  }

  /* Bottom Companion Capsule Dock (Exact match to your UI) */
  .bottom-dock {
    width: auto;
    background: var(--dock-bg);
    border: 1px solid var(--dock-border);
    backdrop-filter: blur(18px);
    border-radius: 40px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 255, 0.12);
    z-index: 20;
    margin-bottom: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dock-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #cbd5e1;
    padding: 10px 16px;
    border-radius: 24px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
    font-family: 'Nunito', sans-serif;
  }

  .dock-btn:hover {
    background: var(--btn-hover);
    color: var(--cyan-light);
    border-color: rgba(0, 240, 255, 0.3);
  }

  .dock-btn.active {
    background: rgba(0, 240, 255, 0.2);
    color: var(--cyan-glow);
    border-color: var(--cyan-glow);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
  }

  .dock-btn.mic-active {
    background: rgba(239, 68, 68, 0.25);
    color: #f87171;
    border-color: #ef4444;
    animation: micPulse 1.2s infinite alternate;
  }

  @keyframes micPulse {
    from { box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    to { box-shadow: 0 0 22px rgba(239, 68, 68, 0.85); }
  }

  /* Hidden file input for Friend DB */
  #folderPicker {
    display: none;
  }

  /* Modals for Calendar / Guide / Eye Picker */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(3, 7, 18, 0.8);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }

  .modal-card {
    background: #0f172a;
    border: 1px solid var(--dock-border);
    border-radius: 24px;
    padding: 24px 28px;
    width: 90%;
    max-width: 480px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8);
  }

  .modal-card h3 {
    color: var(--cyan-glow);
    font-family: 'Fredoka', cursive;
    margin-bottom: 12px;
  }

  .modal-card p, .modal-card li {
    font-size: 14px;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .modal-close {
    background: var(--cyan-glow);
    color: #020617;
    border: none;
    border-radius: 12px;
    padding: 8px 18px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 14px;
    float: right;
  }
</style>
</head>
<body>

<!-- Webcam for Real Face / Gaze Tracking -->
<video id="webcamVideo" autoplay playsinline muted></video>

<!-- Top Awaken Pill -->
<div class="awaken-pill" onclick="awakenBot()">
  <div class="pulse-dot"></div>
  <span id="awakenStatus">TAP TO AWAKEN</span>
</div>

<!-- Main Robot Canvas -->
<main class="bot-stage">
  <div class="bot-body-wrapper" id="botWrapper">
    <div class="antenna-container">
      <div class="antenna-stalk left"><div class="antenna-tip"></div></div>
      <div class="antenna-stalk right"><div class="antenna-tip"></div></div>
    </div>

    <div class="bot-head">
      <div class="ear left"></div>
      <div class="ear right"></div>
      
      <div class="bot-visor">
        <div class="eyes-row">
          <div class="eye-socket" id="eyeL">
            <div class="pupil" id="pupilL"><div class="glint"></div></div>
          </div>
          <div class="eye-socket" id="eyeR">
            <div class="pupil" id="pupilR"><div class="glint"></div></div>
          </div>
        </div>
        <div class="bot-smile"></div>
      </div>
    </div>

    <div class="bot-neck"></div>

    <div class="bot-torso">
      <div class="arm left"><div class="arm-glow"></div></div>
      <div class="chest-stripe"></div>
      <div class="arm right"><div class="arm-glow"></div></div>
    </div>

    <div class="bot-feet">
      <div class="foot"></div>
      <div class="foot"></div>
    </div>
  </div>

  <!-- Robot Speech Subtitle -->
  <div class="dialogue-text" id="dialogueOutput">
    Hi buddy, connect me to Database first or ask me anything!
  </div>

  <!-- In-Case Voice Fails: Manual Input & Submit Button -->
  <div class="input-bar-container">
    <input type="text" id="manualInput" placeholder="Type prompt here if voice fails (Math, Trivia, Emotions)..." onkeypress="handleEnter(event)" />
    <button class="submit-btn" onclick="submitManualText()">Submit</button>
  </div>
</main>

<!-- Bottom Companion Dock (Exact UI replica) -->
<footer class="bottom-dock">
  <button class="dock-btn" id="gazeBtn" onclick="toggleGazeTrack()">
    <span>📷 Gaze Track</span>
  </button>
  <button class="dock-btn" id="micBtn" onclick="toggleContinuousMic()">
    <span>🎙️ Continuous Mic</span>
  </button>
  <button class="dock-btn" onclick="cycleEyeColor()">
    <span>🎨 Eye Color</span>
  </button>
  <button class="dock-btn" onclick="pickFriendFolder()">
    <span>📁 Friend DB</span>
  </button>
  <button class="dock-btn" onclick="openCalendar()">
    <span>📅 Calendar</span>
  </button>
  <button class="dock-btn" onclick="openGuide()">
    <span>❓ Guide</span>
  </button>
  <button class="dock-btn" onclick="toggleFullscreen()">
    <span>⛶ Fullscreen</span>
  </button>
</footer>

<!-- Hidden Native Folder Picker for Friend DB -->
<input type="file" id="folderPicker" webkitdirectory directory multiple onchange="loadFriendDatabase(event)" />

<!-- Info Modal -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-card">
    <h3 id="modalTitle">Charan Das Guide</h3>
    <div id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  let isAwake = false;
  let gazeActive = false;
  let continuousMicActive = false;
  let speechRec = null;
  let eyeColors = [
    'radial-gradient(circle, #00f0ff 0%, #0284c7 65%, #034f77 100%)',
    'radial-gradient(circle, #a855f7 0%, #7e22ce 65%, #3b0764 100%)',
    'radial-gradient(circle, #22c55e 0%, #16a34a 65%, #14532d 100%)',
    'radial-gradient(circle, #f59e0b 0%, #d97706 65%, #78350f 100%)',
    'radial-gradient(circle, #ec4899 0%, #be185d 65%, #500724 100%)'
  ];
  let eyeColorIdx = 0;
  let friendKnowledge = {};

  // 1. Awaken Robot
  function awakenBot() {
    isAwake = true;
    document.getElementById('awakenStatus').innerText = "AWAKE & LISTENING";
    document.getElementById('awakenStatus').style.color = "#00f0ff";
    botSpeak("Charan Das is awakened and ready on your desk!");
    wiggleBot();
  }

  function wiggleBot() {
    const b = document.getElementById('botWrapper');
    b.style.transform = "rotate(-5deg) translateY(-8px)";
    setTimeout(() => { b.style.transform = "rotate(5deg) translateY(-8px)"; }, 180);
    setTimeout(() => { b.style.transform = "rotate(0deg) translateY(0px)"; }, 360);
  }

  // 2. Continuous Gaze Tracking (Mouse + WebCam face fallback)
  function setupMouseGaze() {
    window.addEventListener('mousemove', (e) => {
      if (!gazeActive) return;
      trackGaze(e.clientX, e.clientY);
    });
  }
  setupMouseGaze();

  function trackGaze(x, y) {
    const pL = document.getElementById('pupilL');
    const pR = document.getElementById('pupilR');
    const b = document.getElementById('botWrapper');

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2.3;

    const dx = Math.min(Math.max((x - centerX) / (window.innerWidth / 2), -1), 1);
    const dy = Math.min(Math.max((y - centerY) / (window.innerHeight / 2), -1), 1);

    const shiftX = dx * 13;
    const shiftY = dy * 13;

    pL.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;
    pR.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;

    // Gentle 3D head tilt
    b.style.transform = `rotate(${dx * 6}deg) translateY(${dy * 4}px)`;
  }

  async function toggleGazeTrack() {
    const btn = document.getElementById('gazeBtn');
    const video = document.getElementById('webcamVideo');

    if (!gazeActive) {
      gazeActive = true;
      btn.classList.add('active');
      setDialogue("Gaze Tracking activated! Moving my eyes to follow you.");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
        video.srcObject = stream;
        video.style.display = "block";
      } catch (err) {
        console.log("Webcam denied, falling back to dynamic mouse/cursor gaze track.");
      }
    } else {
      gazeActive = false;
      btn.classList.remove('active');
      video.style.display = "none";
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }
      // Reset eyes
      document.getElementById('pupilL').style.transform = 'translate(-50%, -50%)';
      document.getElementById('pupilR').style.transform = 'translate(-50%, -50%)';
      document.getElementById('botWrapper').style.transform = 'none';
      setDialogue("Gaze Tracking paused.");
    }
  }

  // 3. Continuous Mic (Web Speech Recognition Loop)
  function toggleContinuousMic() {
    const btn = document.getElementById('micBtn');

    if (!continuousMicActive) {
      startSpeechRecognition();
      continuousMicActive = true;
      btn.classList.add('mic-active');
      setDialogue("Continuous Mic ON: Speak to me naturally anytime!");
    } else {
      continuousMicActive = false;
      btn.classList.remove('mic-active');
      if (speechRec) {
        speechRec.stop();
      }
      setDialogue("Continuous Mic turned off.");
    }
  }

  function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Continuous Speech Recognition not supported in this browser. Please use Chrome/Edge or manual submit.");
      return;
    }

    speechRec = new SpeechRecognition();
    speechRec.continuous = true;
    speechRec.interimResults = false;
    speechRec.lang = 'en-US';

    speechRec.onresult = (event) => {
      const last = event.results.length - 1;
      const text = event.results[last][0].transcript.trim();
      if (text) {
        console.log("Voice Input Received:", text);
        handleBotInteraction(text);
      }
    };

    speechRec.onerror = (e) => {
      console.warn("Speech Rec Error:", e.error);
    };

    speechRec.onend = () => {
      // Keep mic continuously alive if toggle is active
      if (continuousMicActive) {
        try { speechRec.start(); } catch(err){}
      }
    };

    try {
      speechRec.start();
    } catch(err){}
  }

  // 4. Text Fallback & Submit Button
  function submitManualText() {
    const input = document.getElementById('manualInput');
    const txt = input.value.trim();
    if (!txt) return;
    handleBotInteraction(txt);
    input.value = '';
  }

  function handleEnter(e) {
    if (e.key === 'Enter') submitManualText();
  }

  // 5. Intelligent Query Reasoning Engine
  function handleBotInteraction(rawText) {
    const q = rawText.toLowerCase().trim();
    setDialogue(`"${rawText}"`);

    setTimeout(() => {
      let reply = "";

      // Check Friend DB (loaded JSON files) first
      if (friendKnowledge['states'] && q.includes('telangana')) {
        reply = "From Friend DB: Capital of Telangana is Hyderabad.";
      }

      // Persona & Identity
      if (!reply) {
        if (q.includes('who are you') || q.includes('your name')) {
          reply = "I am Charan Das, GARR Foundation's bot, developed by Dr. Venu Gopal Madhav Annamdas. I am your desktop buddy!";
        } else if (q.includes('who made') || q.includes('who created') || q.includes('developer') || q.includes('dr. venu')) {
          reply = "I was developed by Dr. Venu Gopal Madhav Annamdas under the Gopalkrishna Advanced Rural Research Foundation (GARRF).";
        } else if (q.includes('modi')) {
          reply = "Narendra Modi is the Prime Minister of India, leading the nation since May 2014.";
        } else if (q.includes('capital of usa') || q.includes('capital of the usa')) {
          reply = "The capital of the United States of America is Washington, D.C.";
        } else if (q.includes('how many states') && q.includes('usa')) {
          reply = "There are 50 states in the USA, along with 1 federal district and territories.";
        } else if (q.includes('capital of telangana')) {
          reply = "The capital of Telangana is Hyderabad, known for its IT hub and heritage.";
        } else if (q.includes('union territories') || q.includes('union territory')) {
          reply = "India has 8 Union Territories.";
        } else if (q.includes('how many states') && q.includes('india')) {
          reply = "India currently has 28 states and 8 Union Territories.";
        } else if (q.includes('currency of india')) {
          reply = "The currency of India is the Indian Rupee (INR, symbol: ₹).";
        } else if (q.includes('currency of usa') || q.includes('currency of us')) {
          reply = "The currency of the United States is the US Dollar (USD, symbol: $).";
        } else if (q.includes('currency of japan')) {
          reply = "The currency of Japan is the Japanese Yen (JPY, symbol: ¥).";
        } else if (q.includes('sad') || q.includes('unhappy') || q.includes('bad') || q.includes('crying')) {
          reply = "I'm sorry you are feeling down. Take a deep breath. Charan Das is right here on your desk with you—you are never alone!";
        } else if (q.includes('good') || q.includes('happy') || q.includes('nice') || q.includes('awesome')) {
          wiggleBot();
          reply = "Yay! That makes me so happy too! Let's make today productive and awesome!";
        }
      }

      // Mathematical Solver (sqrt, sin, cos, tan, +, -, *, /, %)
      if (!reply) {
        if (q.includes('sqrt') || q.includes('square root')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) reply = `The square root of ${m[0]} is ${Math.sqrt(parseFloat(m[0]))}.`;
        } else if (q.includes('sin(') || q.includes('sine')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) reply = `sin(${m[0]}°) = ${Math.sin(parseFloat(m[0]) * Math.PI / 180).toFixed(4)}.`;
        } else if (q.includes('cos(') || q.includes('cosine')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) reply = `cos(${m[0]}°) = ${Math.cos(parseFloat(m[0]) * Math.PI / 180).toFixed(4)}.`;
        } else if (q.includes('tan(') || q.includes('tangent')) {
          const m = q.match(/(\d+(\.\d+)?)/);
          if (m) {
            const deg = parseFloat(m[0]);
            reply = (deg % 180 === 90) ? `tan(${deg}°) is undefined.` : `tan(${deg}°) = ${Math.tan(deg * Math.PI / 180).toFixed(4)}.`;
          }
        } else {
          // Direct Arithmetic
          try {
            const mathClean = q.replace(/calculate|what is|equals|\?|hey buddy/gi, '').trim();
            if (/^[0-9\.\s\+\-\*\/\%]+$/.test(mathClean)) {
              const calcRes = Function(`"use strict"; return (${mathClean})`)();
              reply = `${mathClean} = ${calcRes}`;
            }
          } catch(err){}
        }
      }

      if (!reply) {
        reply = "I'm listening! You can ask me math equations, trivia, tell me your mood, or load the Friend DB.";
      }

      setDialogue(reply);
      botSpeak(reply);
    }, 400);
  }

  function setDialogue(txt) {
    document.getElementById('dialogueOutput').innerText = txt;
  }

  function botSpeak(txt) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const clean = txt.replace(/<[^>]*>/g, '').replace(/[*_#~]/g, '');
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 1.05;
    u.pitch = 1.25; // cute robotic buddy pitch
    window.speechSynthesis.speak(u);
  }

  // 6. Dock Actions: Eye Color, Friend DB, Calendar, Guide, Fullscreen
  function cycleEyeColor() {
    eyeColorIdx = (eyeColorIdx + 1) % eyeColors.length;
    document.getElementById('eyeL').style.background = eyeColors[eyeColorIdx];
    document.getElementById('eyeR').style.background = eyeColors[eyeColorIdx];
  }

  function pickFriendFolder() {
    document.getElementById('folderPicker').click();
  }

  function loadFriendDatabase(e) {
    const files = e.target.files;
    let loadedCount = 0;
    Array.from(files).forEach(f => {
      if (f.name.endsWith('.json') || f.name.endsWith('.jsonl')) {
        const reader = new FileReader();
        reader.onload = (re) => {
          friendKnowledge[f.name] = re.target.result;
          loadedCount++;
          setDialogue(`Connected to Friend DB! Loaded: ${f.name} (${loadedCount} files loaded)`);
        };
        reader.readAsText(f);
      }
    });
    botSpeak("Friend Database connected successfully!");
  }

  function openCalendar() {
    const now = new Date();
    showModal("📅 Charan Das Calendar & Clock", `
      <p><strong>Today's Date:</strong> ${now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
      <p><strong>Local Time:</strong> ${now.toLocaleTimeString()}</p>
      <p><strong>Sync Status:</strong> Synchronized with device hardware RTC.</p>
    `);
  }

  function openGuide() {
    showModal("❓ Charan Das Desktop Companion Guide", `
      <ul>
        <li><strong>📷 Gaze Track:</strong> Tracks your face/cursor and moves robot eyes in real-time.</li>
        <li><strong>🎙️ Continuous Mic:</strong> Keeps the microphone always listening for hands-free queries.</li>
        <li><strong>⌨️ Text Submit:</strong> Use the input bar + Submit button if voice fails or in noisy rooms.</li>
        <li><strong>📁 Friend DB:</strong> Select the friend folder containing <code>charan_das_true_buddy_25k.jsonl</code>, <code>india_states_ut.json</code>, etc.</li>
        <li><strong>🎨 Eye Color:</strong> Cycle through Cyan, Violet, Emerald, Amber, and Pink OLED eyes.</li>
      </ul>
    `);
  }

  function showModal(title, html) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('infoModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('infoModal').style.display = 'none';
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
</script>
</body>
