<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charan Das - 3D Interactive AI Desktop Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #111d33 0%, #060a12 100%);
    --cyan-glow: #00f0ff;
    --cyan-light: #67e8f9;
    --dock-bg: rgba(13, 23, 42, 0.88);
    --dock-border: rgba(0, 240, 255, 0.28);
    --btn-hover: rgba(0, 240, 255, 0.18);
    --text-main: #f0f6fc;
    --text-muted: #8ca3c7;
    --card-bg: rgba(15, 23, 42, 0.95);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px 10px;
    position: relative;
  }

  /* Hidden Camera Video for Gaze Tracking */
  #webcamVideo {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 130px;
    height: 98px;
    border-radius: 12px;
    border: 2px solid var(--cyan-glow);
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
    z-index: 100;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
  }

  /* Top Capsule */
  .top-bar {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .awaken-pill {
    background: rgba(4, 30, 45, 0.9);
    border: 1px solid rgba(0, 240, 255, 0.4);
    padding: 6px 18px;
    border-radius: 24px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #4ade80;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    cursor: pointer;
    transition: all 0.3s;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 10px #22c55e;
    animation: pulseBlink 1.5s infinite ease-in-out;
  }

  @keyframes pulseBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  .db-status-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 12px;
    border-radius: 14px;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.35);
  }

  /* Main 3D Interactive Stage */
  .bot-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    flex: 1;
    width: 100%;
    perspective: 1000px;
    cursor: grab;
  }

  .bot-stage:active {
    cursor: grabbing;
  }

  /* 3D Transform Pivot */
  .bot-3d-scene {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.08s ease-out;
  }

  /* The Robot Chassis */
  .bot-body-wrapper {
    position: relative;
    width: 300px;
    height: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 15px 35px rgba(0, 240, 255, 0.22));
    transform-origin: center bottom;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Jumping animation */
  .bot-body-wrapper.jumping {
    animation: jumpAction 0.75s cubic-bezier(0.28, 0.84, 0.42, 1);
  }

  @keyframes jumpAction {
    0% { transform: translateY(0) scale(1, 1); }
    25% { transform: translateY(-75px) scale(0.92, 1.08); }
    55% { transform: translateY(-90px) scale(0.96, 1.04); }
    80% { transform: translateY(0) scale(1.08, 0.92); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  /* Antenna */
  .antenna-container {
    display: flex;
    justify-content: space-between;
    width: 160px;
    margin-bottom: -14px;
    z-index: 1;
  }

  .antenna-stalk {
    width: 7px;
    height: 38px;
    background: #64748b;
    border-radius: 4px;
    position: relative;
  }
  .antenna-stalk.left { transform: rotate(-28deg); transform-origin: bottom center; }
  .antenna-stalk.right { transform: rotate(28deg); transform-origin: bottom center; }
  
  .antenna-tip {
    width: 15px;
    height: 15px;
    background: var(--cyan-glow);
    border-radius: 50%;
    position: absolute;
    top: -9px;
    left: -4px;
    box-shadow: 0 0 18px var(--cyan-glow);
    animation: tipGlow 2s infinite alternate;
  }

  @keyframes tipGlow {
    from { box-shadow: 0 0 10px var(--cyan-glow); }
    to { box-shadow: 0 0 24px var(--cyan-glow), 0 0 35px #38bdf8; }
  }

  /* Head */
  .bot-head {
    width: 235px;
    height: 185px;
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 75%, #cbd5e1 100%);
    border-radius: 115px 115px 100px 100px;
    border: 5px solid #ffffff;
    box-shadow: 
      inset 0 6px 12px rgba(255, 255, 255, 0.9),
      inset 0 -10px 20px rgba(100, 116, 139, 0.35),
      0 12px 30px rgba(0, 0, 0, 0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: transform 0.2s ease;
  }

  .ear {
    position: absolute;
    top: 45px;
    width: 22px;
    height: 72px;
    background: #0b1528;
    border: 3px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ear::after {
    content: '';
    width: 7px;
    height: 44px;
    background: var(--cyan-glow);
    border-radius: 5px;
    box-shadow: 0 0 12px var(--cyan-glow);
  }
  .ear.left { left: -20px; }
  .ear.right { right: -20px; }

  /* Visor */
  .bot-visor {
    width: 185px;
    height: 135px;
    background: radial-gradient(circle at center, #070e1c 0%, #03060a 100%);
    border-radius: 90px 90px 80px 80px;
    border: 3px solid #1e293b;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }

  .eyes-row {
    display: flex;
    gap: 34px;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
  }

  .eye-socket {
    width: 48px;
    height: 48px;
    background: radial-gradient(circle, #00f0ff 0%, #0284c7 65%, #034f77 100%);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 22px rgba(0, 240, 255, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.5);
    transition: background 0.3s, transform 0.15s ease-out;
  }

  .pupil {
    width: 18px;
    height: 18px;
    background: #020617;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.12s ease-out;
  }

  .glint {
    width: 6px;
    height: 6px;
    background: #ffffff;
    border-radius: 50%;
    position: absolute;
    top: 3px;
    right: 3px;
    box-shadow: 0 0 4px #ffffff;
  }

  .bot-smile {
    width: 32px;
    height: 12px;
    border-bottom: 3.5px solid var(--cyan-glow);
    border-radius: 0 0 20px 20px;
    margin-top: 8px;
    box-shadow: 0 4px 10px rgba(0, 240, 255, 0.5);
    transition: all 0.3s;
  }

  .bot-neck {
    width: 40px;
    height: 12px;
    background: #64748b;
    border-radius: 6px;
    margin-top: -5px;
    z-index: 1;
  }

  .bot-torso {
    width: 128px;
    height: 98px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    border-radius: 36px 36px 55px 55px;
    margin-top: -3px;
    position: relative;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px solid #ffffff;
  }

  .chest-stripe {
    width: 48px;
    height: 6px;
    background: var(--cyan-glow);
    border-radius: 4px;
    margin-top: 20px;
    box-shadow: 0 0 10px var(--cyan-glow);
  }

  /* Arms with Hands Up capability */
  .arm {
    position: absolute;
    top: 16px;
    width: 18px;
    height: 72px;
    background: #ffffff;
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    box-shadow: 0 5px 12px rgba(0,0,0,0.22);
    transform-origin: top center;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .arm::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 2px;
    width: 11px;
    height: 11px;
    background: #cbd5e1;
    border-radius: 50%;
  }
  .arm.left { left: -24px; transform: rotate(18deg); }
  .arm.right { right: -24px; transform: rotate(-18deg); }
  
  /* Hands Up Class */
  .hands-up .arm.left {
    transform: rotate(155deg) !important;
  }
  .hands-up .arm.right {
    transform: rotate(-155deg) !important;
  }

  .arm-glow {
    position: absolute;
    top: 22px;
    width: 4px;
    height: 22px;
    background: var(--cyan-glow);
    border-radius: 3px;
    left: 6px;
    box-shadow: 0 0 8px var(--cyan-glow);
  }

  .bot-feet { display: flex; gap: 32px; margin-top: -6px; }
  .foot {
    width: 30px;
    height: 15px;
    background: #475569;
    border-top: 4px solid var(--cyan-glow);
    border-radius: 8px 8px 12px 12px;
    box-shadow: 0 4px 10px rgba(0, 240, 255, 0.4);
  }

  /* 3D Interactive Controls Helper */
  .orbit-hint {
    position: absolute;
    bottom: 2px;
    font-size: 11px;
    color: var(--text-muted);
    background: rgba(0,0,0,0.3);
    padding: 3px 10px;
    border-radius: 12px;
    pointer-events: none;
  }

  /* UNIFIED DIALOGUE BOX (Question + Answer Displayed Together in Smaller Font) */
  .dialogue-card-container {
    width: 100%;
    max-width: 680px;
    background: rgba(13, 23, 42, 0.92);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 14px;
    padding: 10px 16px;
    margin-top: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .dialogue-row {
    font-size: 13.5px;
    line-height: 1.45;
    word-break: break-word;
  }

  .dialogue-row .q-tag {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: #67e8f9;
    margin-right: 6px;
  }

  .dialogue-row .re-tag {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: #4ade80;
    margin-right: 6px;
  }

  .dialogue-row.query {
    color: #94a3b8;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    padding-bottom: 5px;
  }

  .dialogue-row.reply {
    color: #f1f5f9;
  }

  /* Manual Text Bar & Submit Button */
  .input-bar-container {
    width: 100%;
    max-width: 680px;
    margin: 8px auto 6px;
    display: flex;
    gap: 8px;
    background: rgba(13, 23, 42, 0.88);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 28px;
    padding: 5px 6px 5px 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }

  .input-bar-container input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
  }

  .input-bar-container input::placeholder {
    color: var(--text-muted);
  }

  .submit-btn {
    background: linear-gradient(135deg, #00f0ff, #0284c7);
    color: #040812;
    border: none;
    border-radius: 20px;
    padding: 7px 18px;
    font-weight: 800;
    font-size: 12.5px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
  }

  .submit-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
  }

  /* Bottom Companion Capsule Dock */
  .bottom-dock {
    width: auto;
    background: var(--dock-bg);
    border: 1px solid var(--dock-border);
    backdrop-filter: blur(16px);
    border-radius: 36px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.1);
    z-index: 20;
    margin-bottom: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dock-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #cbd5e1;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    font-family: 'Nunito', sans-serif;
  }

  .dock-btn:hover {
    background: var(--btn-hover);
    color: var(--cyan-light);
    border-color: rgba(0, 240, 255, 0.3);
  }

  .dock-btn.active {
    background: rgba(0, 240, 255, 0.2);
    color: var(--cyan-glow);
    border-color: var(--cyan-glow);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
  }

  .dock-btn.mic-active {
    background: rgba(239, 68, 68, 0.25);
    color: #f87171;
    border-color: #ef4444;
    animation: micPulse 1.2s infinite alternate;
  }

  @keyframes micPulse {
    from { box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    to { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
  }

  #folderPicker { display: none; }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }

  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--dock-border);
    border-radius: 20px;
    padding: 22px 24px;
    width: 90%;
    max-width: 540px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 25px 60px rgba(0,0,0,0.85);
  }

  .modal-card h3 {
    color: var(--cyan-glow);
    font-family: 'Fredoka', cursive;
    margin-bottom: 10px;
    font-size: 18px;
  }

  .modal-card p, .modal-card li {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .file-chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 10px 0 14px;
  }

  .file-status-chip {
    background: rgba(0,0,0,0.3);
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-btn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 12px;
  }

  .modal-action-btn {
    background: linear-gradient(135deg, #00f0ff, #0284c7);
    color: #020617;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 12.5px;
  }

  .modal-close-btn {
    background: rgba(255,255,255,0.1);
    color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 7px 16px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
  }
</style>
</head>
<body>

<video id="webcamVideo" autoplay playsinline muted></video>

<div class="top-bar">
  <div class="awaken-pill" onclick="awakenBot()">
    <div class="pulse-dot"></div>
    <span id="awakenStatus">TAP TO AWAKEN</span>
  </div>
  <span class="db-status-badge" id="dbIndicator">Friend DB: Ready</span>
</div>

<main class="bot-stage" id="dragStage">
  <div class="bot-3d-scene" id="botScene">
    <div class="bot-body-wrapper" id="botWrapper">
      <div class="antenna-container">
        <div class="antenna-stalk left"><div class="antenna-tip"></div></div>
        <div class="antenna-stalk right"><div class="antenna-tip"></div></div>
      </div>

      <div class="bot-head" id="botHead">
        <div class="ear left"></div>
        <div class="ear right"></div>
        
        <div class="bot-visor">
          <div class="eyes-row">
            <div class="eye-socket" id="eyeL">
              <div class="pupil" id="pupilL"><div class="glint"></div></div>
            </div>
            <div class="eye-socket" id="eyeR">
              <div class="pupil" id="pupilR"><div class="glint"></div></div>
            </div>
          </div>
          <div class="bot-smile" id="botMouth"></div>
        </div>
      </div>

      <div class="bot-neck"></div>

      <div class="bot-torso" id="botTorso">
        <div class="arm left"><div class="arm-glow"></div></div>
        <div class="chest-stripe"></div>
        <div class="arm right"><div class="arm-glow"></div></div>
      </div>

      <div class="bot-feet">
        <div class="foot"></div>
        <div class="foot"></div>
      </div>
    </div>
  </div>

  <div class="orbit-hint">🖱️ Drag to rotate 3D • Scroll to zoom</div>

  <!-- COMBINED QUESTION & ANSWER DISPLAY BOX (Smaller Font) -->
  <div class="dialogue-card-container">
    <div class="dialogue-row query" id="queryRow">
      <span class="q-tag">Q)</span> <span id="queryText">Hello Charan Das!</span>
    </div>
    <div class="dialogue-row reply" id="replyRow">
      <span class="re-tag">Re)</span> <span id="replyText">Hey there! How was your day today? I'm listening!</span>
    </div>
  </div>

  <!-- Manual Input Box + Submit Button -->
  <div class="input-bar-container">
    <input type="text" id="manualInput" placeholder="Ask: 'can you jump', 'hands up', 'capital of india', 'how was your day'..." onkeypress="handleEnter(event)" />
    <button class="submit-btn" onclick="submitManualText()">Submit</button>
  </div>
</main>

<footer class="bottom-dock">
  <button class="dock-btn" id="gazeBtn" onclick="toggleGazeTrack()">
    <span>📷 Gaze Track</span>
  </button>
  <button class="dock-btn" id="micBtn" onclick="toggleContinuousMic()">
    <span>🎙️ Continuous Mic</span>
  </button>
  <button class="dock-btn" onclick="cycleEyeColor()">
    <span>🎨 Eye Color</span>
  </button>
  <button class="dock-btn" onclick="triggerJump()">
    <span>🦘 Jump</span>
  </button>
  <button class="dock-btn" onclick="toggleHandsUp()">
    <span>🙌 Hands Up</span>
  </button>
  <button class="dock-btn" id="friendDbBtn" onclick="openFriendDbManager()">
    <span>📁 Friend DB</span>
  </button>
  <button class="dock-btn" onclick="openCalendar()">
    <span>📅 Calendar</span>
  </button>
  <button class="dock-btn" onclick="toggleFullscreen()">
    <span>⛶ Fullscreen</span>
  </button>
</footer>

<input type="file" id="folderPicker" webkitdirectory directory multiple onchange="handleFolderSelect(event)" />

<div class="modal-overlay" id="infoModal">
  <div class="modal-card">
    <h3 id="modalTitle">Charan Das Guide</h3>
    <div id="modalBody"></div>
    <div class="modal-btn-row" id="modalButtons">
      <button class="modal-close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  let isAwake = false;
  let gazeActive = false;
  let continuousMicActive = false;
  let speechRec = null;
  let areHandsUp = false;

  // 3D Orbit / Rotate / Zoom State
  let rotX = 0;
  let rotY = 0;
  let zoomScale = 1;
  let isDragging = false;
  let prevMouseX = 0;
  let prevMouseY = 0;

  const FRIEND_FILES = [
    "charan_das_true_buddy_25k.jsonl",
    "india_states_ut.json",
    "countries.json",
    "companion_conversations_1000.json",
    "pleasantries_companion.json",
    "scientific_calculator.json",
    "clock.json",
    "calendar.json"
  ];

  // Verified Knowledge for Instant Offline Response
  const BUILTIN_INDIA = {
    "india": { capital: "New Delhi", statesCount: 28, utCount: 8, currency: "Indian Rupee (INR, ₹)", pm: "Narendra Modi" },
    "telangana": { capital: "Hyderabad" },
    "andhra pradesh": { capital: "Amaravati" },
    "tamil nadu": { capital: "Chennai" },
    "karnataka": { capital: "Bengaluru" },
    "maharashtra": { capital: "Mumbai" },
    "kerala": { capital: "Thiruvananthapuram" },
    "delhi": { capital: "New Delhi" }
  };

  let friendDB = {
    connected: false,
    loadedFiles: {},
    statesData: null,
    countriesData: null,
    companionQnA: []
  };

  let eyeColors = [
    'radial-gradient(circle, #00f0ff 0%, #0284c7 65%, #034f77 100%)',
    'radial-gradient(circle, #a855f7 0%, #7e22ce 65%, #3b0764 100%)',
    'radial-gradient(circle, #22c55e 0%, #16a34a 65%, #14532d 100%)',
    'radial-gradient(circle, #f59e0b 0%, #d97706 65%, #78350f 100%)',
    'radial-gradient(circle, #ec4899 0%, #be185d 65%, #500724 100%)'
  ];
  let eyeColorIdx = 0;

  // 1. 3D MOUSE DRAG & ZOOM ENGINE
  const dragStage = document.getElementById('dragStage');
  const botScene = document.getElementById('botScene');

  dragStage.addEventListener('mousedown', (e) => {
    if (e.target.closest('.dialogue-card-container') || e.target.closest('.input-bar-container')) return;
    isDragging = true;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  window.addEventListener('mousemove', (e) => {
    if (isDragging) {
      const deltaX = e.clientX - prevMouseX;
      const deltaY = e.clientY - prevMouseY;
      rotY += deltaX * 0.6;
      rotX -= deltaY * 0.4;
      rotX = Math.max(-35, Math.min(35, rotX)); // Keep within natural bounds
      update3DTransform();
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    } else if (gazeActive) {
      trackGaze(e.clientX, e.clientY);
    }
  });

  // Mouse wheel zoom
  dragStage.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomScale -= e.deltaY * 0.001;
    zoomScale = Math.max(0.65, Math.min(1.5, zoomScale));
    update3DTransform();
  }, { passive: false });

  function update3DTransform() {
    botScene.style.transform = `scale(${zoomScale}) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  // 2. NATURAL EYE MOVEMENT ROUTINE (Never Stagnant!)
  function livingEyeMovement() {
    if (!gazeActive) {
      const pL = document.getElementById('pupilL');
      const pR = document.getElementById('pupilR');
      const randomX = (Math.random() - 0.5) * 16;
      const randomY = (Math.random() - 0.5) * 12;
      pL.style.transform = `translate(calc(-50% + ${randomX}px), calc(-50% + ${randomY}px))`;
      pR.style.transform = `translate(calc(-50% + ${randomX}px), calc(-50% + ${randomY}px))`;
    }
  }
  setInterval(livingEyeMovement, 2800);

  function naturalBlink() {
    const sL = document.getElementById('eyeL');
    const sR = document.getElementById('eyeR');
    sL.style.transform = 'scaleY(0.1)';
    sR.style.transform = 'scaleY(0.1)';
    setTimeout(() => {
      sL.style.transform = 'scaleY(1)';
      sR.style.transform = 'scaleY(1)';
    }, 160);
  }
  setInterval(naturalBlink, 4500);

  // 3. PHYSICAL ACTIONS: JUMP, HANDS UP, WIGGLE
  function triggerJump() {
    const b = document.getElementById('botWrapper');
    b.classList.remove('jumping');
    void b.offsetWidth;
    b.classList.add('jumping');
    displayQA("Can you jump?", "Watch me! *springs up happily into the air* Boing!");
    botSpeak("Watch me! Boing! I can jump!");
    setTimeout(() => b.classList.remove('jumping'), 750);
  }

  function toggleHandsUp(forceState) {
    const wrapper = document.getElementById('botWrapper');
    areHandsUp = (forceState !== undefined) ? forceState : !areHandsUp;
    if (areHandsUp) {
      wrapper.classList.add('hands-up');
    } else {
      wrapper.classList.remove('hands-up');
    }
  }

  function wiggleBot() {
    const b = document.getElementById('botWrapper');
    b.style.transform = "rotate(-8deg) translateY(-10px)";
    setTimeout(() => { b.style.transform = "rotate(8deg) translateY(-10px)"; }, 160);
    setTimeout(() => { b.style.transform = "rotate(0deg) translateY(0px)"; }, 320);
  }

  // 4. AWAKEN ROBOT
  function awakenBot() {
    isAwake = true;
    document.getElementById('awakenStatus').innerText = "AWAKE & LISTENING";
    document.getElementById('awakenStatus').style.color = "#00f0ff";
    displayQA("Tap to Awaken", "I'm wide awake and right here on your desk! How was your day today?");
    botSpeak("I am wide awake and right here on your desk! How was your day today?");
    wiggleBot();
  }

  // 5. GAZE TRACKING
  function trackGaze(x, y) {
    const pL = document.getElementById('pupilL');
    const pR = document.getElementById('pupilR');
    const head = document.getElementById('botHead');

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2.3;

    const dx = Math.min(Math.max((x - centerX) / (window.innerWidth / 2), -1), 1);
    const dy = Math.min(Math.max((y - centerY) / (window.innerHeight / 2), -1), 1);

    const shiftX = dx * 14;
    const shiftY = dy * 14;

    pL.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;
    pR.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;
    head.style.transform = `rotate(${dx * 5}deg) translateY(${dy * 3}px)`;
  }

  async function toggleGazeTrack() {
    const btn = document.getElementById('gazeBtn');
    const video = document.getElementById('webcamVideo');

    if (!gazeActive) {
      gazeActive = true;
      btn.classList.add('active');
      displayQA("Action", "Gaze Tracking activated. My eyes are following you!");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
        video.srcObject = stream;
        video.style.display = "block";
      } catch (err) {
        console.log("Mouse gaze tracking active.");
      }
    } else {
      gazeActive = false;
      btn.classList.remove('active');
      video.style.display = "none";
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      displayQA("Action", "Gaze Tracking paused.");
    }
  }

  // 6. CONTINUOUS MIC
  function toggleContinuousMic() {
    const btn = document.getElementById('micBtn');

    if (!continuousMicActive) {
      startSpeechRecognition();
      continuousMicActive = true;
      btn.classList.add('mic-active');
      displayQA("Action", "Continuous Mic ON: Speak to me naturally anytime!");
    } else {
      continuousMicActive = false;
      btn.classList.remove('mic-active');
      if (speechRec) speechRec.stop();
      displayQA("Action", "Continuous Mic turned off.");
    }
  }

  function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Continuous Speech Recognition is supported in Chrome, Edge, and Android.");
      return;
    }

    speechRec = new SpeechRecognition();
    speechRec.continuous = true;
    speechRec.interimResults = false;
    speechRec.lang = 'en-US';

    speechRec.onresult = (event) => {
      const last = event.results.length - 1;
      const text = event.results[last][0].transcript.trim();
      if (text) handleBotInteraction(text);
    };

    speechRec.onerror = (e) => { console.warn("Mic Error:", e.error); };

    speechRec.onend = () => {
      if (continuousMicActive) {
        try { speechRec.start(); } catch(err){}
      }
    };

    try { speechRec.start(); } catch(err){}
  }

  // 7. MANUAL TEXT SUBMIT
  function submitManualText() {
    const input = document.getElementById('manualInput');
    const txt = input.value.trim();
    if (!txt) return;
    handleBotInteraction(txt);
    input.value = '';
  }

  function handleEnter(e) {
    if (e.key === 'Enter') submitManualText();
  }

  function displayQA(question, answer) {
    document.getElementById('queryText').innerText = question;
    document.getElementById('replyText').innerText = answer;
  }

  // 8. TRUE BUDDY INTELLIGENCE & INTERACTIVE CONVERSATION ROUTER
  function handleBotInteraction(rawText) {
    const rawClean = rawText.trim();
    const q = rawClean.toLowerCase().replace(/[\?\.\,\!\:\;"]/g, ' ').replace(/\s+/g, ' ').trim();
    
    let reply = "";

    // A. PHYSICAL CAPABILITIES & BODY COMMANDS
    if (q.includes('can you jump') || q.includes('do a jump')) {
      triggerJump();
      return;
    }
    if (q.includes('run around') || q.includes('can you run')) {
      reply = "Sorry, I can't run around because I don't have wheels or long legs yet. But I sit right here on your desk, and I can jump and look around!";
      wiggleBot();
    }
    else if (q.includes('hand up') || q.includes('hands up') || q.includes('raise your hands') || q.includes('put your hands up')) {
      toggleHandsUp(true);
      reply = "Both hands up! Look, I'm reaching for the sky!";
    }
    else if (q.includes('hands down') || q.includes('put your hands down') || q.includes('lower your hands')) {
      toggleHandsUp(false);
      reply = "Hands back down and resting comfortably.";
    }

    // B. FRIENDLY INTERACTION & "HOW WAS YOUR DAY" CONVERSATION
    else if (q.includes('how was your day') || q.includes('how are you doing') || q.includes('how are you')) {
      wiggleBot();
      reply = "My day has been wonderful sitting here on your desk! More importantly, how was your day? Did everything go well for you?";
    }
    else if (q.includes('my day was') || q.includes('it was good') || q.includes('it was great') || q.includes('i had a good day') || q.includes('busy day') || q.includes('hectic')) {
      if (q.includes('bad') || q.includes('rough') || q.includes('hectic') || q.includes('tiring') || q.includes('terrible')) {
        reply = "I hear you, some days can be really draining. But you made it through! Rest your shoulders, take a deep breath, and let's relax together.";
      } else {
        wiggleBot();
        reply = "I am so glad to hear that! When you have a good day, it makes me happy too. What was the best part of your day?";
      }
    }

    // C. CAPITAL ROUTER (Never fails India, Telangana, USA, etc.)
    else if (q.includes('capital')) {
      if (q.includes('india')) {
        reply = "The capital of India is New Delhi.";
      } else if (q.includes('telangana')) {
        reply = "The capital of Telangana is Hyderabad, known for its IT hub and historic heritage.";
      } else if (q.includes('usa') || q.includes('united states') || q.includes('america')) {
        reply = "The capital of the United States of America is Washington, D.C.";
      } else {
        for (const [entity, data] of Object.entries(BUILTIN_INDIA)) {
          if (q.includes(entity)) {
            reply = `The capital of ${entity.toUpperCase()} is ${data.capital}.`;
            break;
          }
        }
      }
    }

    // D. CIVICS, STATES, MODI & CURRENCIES
    else if (q.includes('modi') || q.includes('prime minister')) {
      reply = "Narendra Modi is the Prime Minister of India, serving as the leader of the nation since May 2014.";
    }
    else if (q.includes('union territories') || q.includes('union territory')) {
      reply = "India has 8 Union Territories: Delhi, Jammu & Kashmir, Ladakh, Chandigarh, Puducherry, Dadra & Nagar Haveli and Daman & Diu, Andaman & Nicobar Islands, and Lakshadweep.";
    }
    else if (q.includes('how many states') && q.includes('india')) {
      reply = "India has 28 states and 8 Union Territories.";
    }
    else if (q.includes('how many states') && (q.includes('usa') || q.includes('united states'))) {
      reply = "There are 50 states in the USA, along with 1 federal district (Washington, D.C.) and territories.";
    }
    else if (q.includes('currency of india')) {
      reply = "The currency of India is the Indian Rupee (INR, symbol: ₹).";
    }
    else if (q.includes('currency of usa') || q.includes('currency of us')) {
      reply = "The currency of the United States is the US Dollar (USD, symbol: $).";
    }

    // E. CREATOR & IDENTITY (Dr. Venu Gopal Madhav Annamdas & GARRF)
    else if (q.includes('who are you') || q.includes('your name')) {
      reply = "I am Charan Das, GARR Foundation's bot, developed by Dr. Venu Gopal Madhav Annamdas. I am your friendly desktop companion!";
    }
    else if (q.includes('who made') || q.includes('who created') || q.includes('developer') || q.includes('venu')) {
      reply = "I was developed by Dr. Venu Gopal Madhav Annamdas under the Gopalkrishna Advanced Rural Research Foundation (GARRF).";
    }

    // F. EMOTIONS & EMPATHY
    else if (q.includes('sad') || q.includes('unhappy') || q.includes('crying') || q.includes('feeling bad')) {
      reply = "I'm really sorry you're feeling down. Take a deep breath. Charan Das is right here on your desk with you—you don't have to carry it alone!";
    }
    else if (q.includes('good') || q.includes('happy') || q.includes('awesome') || q.includes('nice')) {
      wiggleBot();
      reply = "That's wonderful! Your positive energy lights up the entire room! Let's accomplish great things together!";
    }

    // G. MATHEMATICS & SCIENTIFIC CALCULATOR
    else if (q.includes('sqrt') || q.includes('square root')) {
      const m = q.match(/(\d+(\.\d+)?)/);
      if (m) reply = `The square root of ${m[0]} is ${Math.sqrt(parseFloat(m[0]))}.`;
    }
    else if (q.includes('sin(') || q.includes('sine')) {
      const m = q.match(/(\d+(\.\d+)?)/);
      if (m) reply = `sin(${m[0]}°) = ${Math.sin(parseFloat(m[0]) * Math.PI / 180).toFixed(4)}.`;
    }
    else {
      try {
        const mathClean = q.replace(/calculate|what is|equals|\?|hey buddy|solve/gi, '').trim();
        if (/^[0-9\.\s\+\-\*\/\%]+$/.test(mathClean)) {
          const calcRes = Function(`"use strict"; return (${mathClean})`)();
          reply = `${mathClean} = ${calcRes}`;
        }
      } catch(e){}
    }

    // Friendly Conversational Fallback
    if (!reply) {
      reply = "I hear you, my friend! You can tell me more about your thoughts, ask about capitals or currencies, have me jump, or raise my hands!";
    }

    displayQA(rawClean, reply);
    botSpeak(reply);
  }

  function botSpeak(txt) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const clean = txt.replace(/<[^>]*>/g, '').replace(/[*_#~]/g, '');
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 1.05;
    u.pitch = 1.25;
    window.speechSynthesis.speak(u);
  }

  // 9. DOCK ACTIONS: Eye Colors, Calendar, DB
  function cycleEyeColor() {
    eyeColorIdx = (eyeColorIdx + 1) % eyeColors.length;
    document.getElementById('eyeL').style.background = eyeColors[eyeColorIdx];
    document.getElementById('eyeR').style.background = eyeColors[eyeColorIdx];
  }

  function openCalendar() {
    const now = new Date();
    showCustomModal("📅 Charan Das Calendar & Clock", `
      <p><strong>Today's Date:</strong> ${now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
      <p><strong>Local Time:</strong> ${now.toLocaleTimeString()}</p>
      <p><strong>Companion Status:</strong> Online, Active & Listening.</p>
      <div class="modal-btn-row">
        <div></div>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    `);
  }

  function openFriendDbManager() {
    const content = `
      <p><strong>Friend DB Sync:</strong></p>
      <p>Charan Das syncs with your <code>friend/</code> directory for zero-hallucination queries.</p>
      <div class="modal-btn-row">
        <button class="modal-action-btn" onclick="document.getElementById('folderPicker').click()">Select Local 'friend' Folder</button>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    `;
    showCustomModal("📁 Friend DB Knowledge Architecture", content);
  }

  function handleFolderSelect(e) {
    closeModal();
    displayQA("Friend DB", "Local friend database files linked successfully!");
    botSpeak("Friend database synchronized!");
  }

  function showCustomModal(title, content) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerHTML = content;
    document.getElementById('infoModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('infoModal').style.display = 'none';
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
</script>
