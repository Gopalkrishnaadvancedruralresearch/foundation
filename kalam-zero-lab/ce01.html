<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const utmCanvas = document.getElementById('utmCanvas');
    const utmCtx = utmCanvas.getContext('2d');

    function resizeCanvases() {
        canvas.width = canvas.parentElement.clientWidth - 40;
        canvas.height = 440;
        utmCanvas.width = utmCanvas.parentElement.clientWidth - 30;
        utmCanvas.height = 180;
    }
    window.addEventListener('resize', () => { resizeCanvases(); updateSim(); });
    resizeCanvases();

    // UTM Animation Engine (Fixed for Tensile Elongation)
    let utmProgress = 0;
    function resetUTM() { utmProgress = 0; }

    function animateUTM() {
        utmCtx.fillStyle = '#020617';
        utmCtx.fillRect(0, 0, utmCanvas.width, utmCanvas.height);

        let centerX = utmCanvas.width / 2;
        let baseLength = 160;
        let stretch = utmProgress * 50; // Elongation distance

        // Draw stationary left grip & moving right grip
        utmCtx.fillStyle = '#64748b';
        utmCtx.fillRect(centerX - baseLength/2 - 25, 50, 20, 80); // Left Grip
        utmCtx.fillRect(centerX + baseLength/2 + stretch, 50, 20, 80); // Right Grip (moving outwards)

        // Specimen dimensions (gets longer and thinner in the middle during necking)
        let specLength = baseLength + stretch;
        let specHeight = Math.max(4, 20 - (utmProgress > 0.6 ? (utmProgress - 0.6) * 30 : 0));

        // Draw Tensile Specimen
        utmCtx.fillStyle = utmProgress >= 1 ? '#ef4444' : '#38bdf8';
        utmCtx.fillRect(centerX - baseLength/2, 90 - specHeight/2, specLength, specHeight);

        // Draw fracture gap if broken
        if (utmProgress >= 1) {
            utmCtx.clearRect(centerX - 3, 75, 6, 30);
            utmCtx.fillStyle = '#fde047';
            utmCtx.font = '12px sans-serif';
            utmCtx.fillText('FRACTURE POINT (Ultimate Tensile Strength)', centerX - 130, 30);
        } else {
            utmCtx.fillStyle = '#ffffff';
            utmCtx.font = '11px sans-serif';
            utmCtx.fillText(`Strain: ${(utmProgress * 0.25).toFixed(2)} mm/mm | Load: ${(utmProgress * 250).toFixed(0)} kN (Tension)`, 50, 165);
        }

        utmProgress += 0.008;
        if (utmProgress > 1.3) utmProgress = 0;

        requestAnimationFrame(animateUTM);
    }
    animateUTM();

    // ... (rest of your structural mechanics simulation code remains the same)
</script>
