<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof. AI Acharya Workspace</title>
    <!-- Document Parsers: Excel, Word, PPTX, PDF, OCR -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root {
            --primary: #0f3057;
            --secondary: #2b6cb0;
            --accent: #48bb78;
            --bg: #0b1426;
            --panel: #111c30;
            --text: #e2e8f0;
            --voice: #e53e3e;
            --course-theme: #0f3057;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: #070d19;
            color: white;
            padding: 18px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 1px solid #1a2e4c;
        }
        .brand-container { display: flex; flex-direction: column; gap: 10px; }
        .top-header-line { display: flex; align-items: center; justify-content: space-between; }
        .brand-left { display: flex; align-items: center; gap: 15px; }
        .logo-container {
            width: 58px; height: 58px; border-radius: 50%; background: #ffffff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0; border: 2px solid #ecc94b;
            box-shadow: 0 0 10px rgba(236, 201, 75, 0.4);
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .foundation-title { 
            margin: 0; 
            font-size: 1.35rem; 
            font-weight: 700; 
            letter-spacing: 0.4px; 
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-guide {
            background: #ecc94b;
            color: #0b1426;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .btn-guide:hover { background: #d69e2e; }

        .sub-header-line { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid #1a2e4c; }
        .acharya-title { margin: 0; font-size: 1.25rem; font-weight: 700; color: #ecc94b; }
        
        .bookmark-alert { 
            background: #233857; 
            color: #fefcbf; 
            padding: 10px 30px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.92rem; 
            border-bottom: 1px solid #2b6cb0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-bookmark-now {
            background: #ecc94b;
            color: #0b1426;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .main-container { max-width: 1400px; margin: 25px auto; padding: 0 20px; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; box-sizing: border-box; }
        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1 !important; }
        }
        .card { background: var(--panel); border-radius: 12px; padding: 25px; box-shadow: 0 6px 12px rgba(0,0,0,0.3); display: flex; flex-direction: column; border: 1px solid #1a2e4c; }
        .card h2 { margin-top: 0; font-size: 1.15rem; color: #ecc94b; margin-bottom: 16px; border-bottom: 1px solid #1a2e4c; padding-bottom: 8px; }
        .full-width { grid-column: span 2; }
        
        .robot-display-box {
            background: var(--course-theme); border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 3px solid #ecc94b; margin-bottom: 20px; transition: background-color 0.4s ease;
            position: relative; min-height: 260px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .robot-head { width: 110px; height: 95px; background: #e2e8f0; border-radius: 35px 35px 25px 25px; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 0 #cbd5e0, 0 10px 20px rgba(0,0,0,0.3); z-index: 2; }
        .robot-headphones { position: absolute; width: 130px; height: 60px; border: 12px solid #2d3748; border-bottom: none; border-radius: 70px 70px 0 0; top: -10px; z-index: 1; }
        .ear-pad { position: absolute; width: 20px; height: 40px; background: #2d3748; border-radius: 8px; top: 30px; }
        .ear-pad.left { left: -15px; } .ear-pad.right { right: -15px; }
        .robot-face { width: 85px; height: 65px; background: #1a202c; border-radius: 20px; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; box-sizing: border-box; }
        .robot-eye { width: 18px; height: 18px; background: #00e5ff; border-radius: 50%; box-shadow: 0 0 12px #00e5ff; transition: all 0.2s; }
        .robot-eye.blinking { height: 3px; margin-top: 8px; }
        .robot-eye.speaking { background: #ecc94b; box-shadow: 0 0 16px #ecc94b; }
        .robot-body { width: 90px; height: 80px; background: #cbd5e0; border-radius: 20px 20px 10px 10px; margin-top: 12px; position: relative; box-shadow: 0 6px 0 #a0aec0; display: flex; justify-content: center; }
        .robot-chest-plate { width: 50px; height: 40px; background: #1a365d; border-radius: 8px; margin-top: 15px; border: 2px solid #e2e8f0; }
        .bot-status-text { margin-top: 15px; font-weight: bold; color: white; font-size: 1.05rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-family: sans-serif; text-align: center; }
        
        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 8, 17, 0.88); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: #111c30; border: 2px solid #ecc94b; border-radius: 12px; padding: 25px 30px; max-width: 650px; width: 92%; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .modal-title { font-size: 1.3rem; font-weight: bold; color: #ecc94b; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .modal-body-text { font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; text-align: left; }
        .modal-body-text h3 { color: #63b3ed; margin-top: 15px; margin-bottom: 6px; font-size: 1.05rem; }
        .modal-body-text ul { padding-left: 20px; margin-top: 4px; margin-bottom: 10px; }
        .modal-btn-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .btn-modal-close { background: #ed8936; color: white; border: none; padding: 10px 22px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-modal-confirm { background: #38a169; color: white; border: none; padding: 10px 22px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        label { font-weight: 600; margin-bottom: 6px; display: block; color: #a0aec0; font-size: 0.9rem; }
