<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 1: PZT Lamb Wave Propagation & Defect Scattering</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.5; background: #f4f6f9; }
        header { border-bottom: 2px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .grid-container { display: flex; gap: 20px; flex-wrap: wrap; }
        section { background: #fff; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        canvas { background: #1a1a24; border-radius: 6px; display: block; margin-top: 10px; width: 100%; max-width: 600px; }
        .ascan-box { background: #181e24; color: #00ffcc; border: 1px solid #333; padding: 12px; min-height: 100px; font-family: monospace; border-radius: 4px; overflow-y: auto; }
        .arjun-box { background: #eef6ff; border-left: 4px solid #0066cc; padding: 15px; margin-top: 10px; min-height: 60px; border-radius: 0 6px 6px 0; }
        button { background: #0066cc; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #004999; }
    </style>
</head>
<body>

    <header>
        <h2>Experiment 1: PZT Lamb Wave Propagation & Defect Scattering</h2>
    </header>
    
    <div class="grid-container">
        <!-- Visualization Area -->
        <section>
            <h3>Wave Propagation (Slow Visualization)</h3>
            <canvas id="waveCanvas" width="600" height="400"></canvas>
        </section>

        <!-- Control & Data Output Panel -->
        <section>
            <h3>Experiment Controls</h3>
            <button id="actuateBtn" onclick="runSimulation()">Trigger Actuation</button>
            <br><br>
            <hr>
            <h3>A-Scan Data Output</h3>
            <div id="ascanOutput" class="ascan-box">
                Awaiting actuation...
            </div>
        </section>
    </div>

    <!-- AI Integration Section -->
    <section style="margin-top: 20px;">
        <h3>AI Assistant Integration (ARJUN)</h3>
        <div id="arjunPanel" class="arjun-box">
            <p><em>AI Agent ARJUN will analyze the ToF (Time of Flight) here.</em></p>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const ascanOutput = document.getElementById('ascanOutput');

        // Setup Experiment Geometry
        const actuator = { x: 80, y: 200, label: "PZT Actuator" };
        const sensor = { x: 520, y: 200, label: "PZT Sensor" };
        const defect = { x: 320, y: 200, radius: 12, label: "Crack / Defect" };

        let waveRadius = 0;
        let scatteredRadius = 0;
        let isSimulating = false;

        function drawBasePlate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Metallic Plate
            ctx.fillStyle = '#2a2e3d';
            ctx.fillRect(30, 50, 540, 300);
            ctx.strokeStyle = '#4a5168';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 50, 540, 300);

            // Actuator (Red PZT)
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath(); ctx.arc(actuator.x, actuator.y, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.font = '11px Arial'; ctx.fillText('Actuator', actuator.x - 20, actuator.y - 15);

            // Sensor (Green PZT)
            ctx.fillStyle = '#00cc66';
            ctx.beginPath(); ctx.arc(sensor.x, sensor.y, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.fillText('Sensor', sensor.x - 15, sensor.y - 15);

            // Defect Hole
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath(); ctx.arc(defect.x, defect.y, defect.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffcc00'; ctx.fillText('Defect', defect.x - 15, defect.y + 25);
        }

        function runSimulation() {
            if (isSimulating) return;
            isSimulating = true;
            waveRadius = 0;
            scatteredRadius = 0;
            ascanOutput.innerHTML = "Generating 150kHz Actuation Signal...<br>";

            function animate() {
                drawBasePlate();

                // Incident Wave Propagation
                if (waveRadius < 500) {
                    waveRadius += 3;
                    ctx.strokeStyle = 'rgba(0, 204, 255, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(actuator.x, actuator.y, waveRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Wave Hits Defect -> Scattered Wave Reflection
                if (waveRadius > (defect.x - actuator.x)) {
                    scatteredRadius += 2.5;
                    ctx.strokeStyle = 'rgba(255, 102, 0, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(defect.x, defect.y, scatteredRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Check Arrival at Sensor
                if (actuator.x + waveRadius >= sensor.x) {
                    ascanOutput.innerHTML = `
                        [Data Stream Received]<br>
                        - Incident Wave ToF: 81.5 μs<br>
                        - Defect Echo ToF: 124.2 μs<br>
                        - Peak Amplitude: 0.82 V<br>
                        - Status: Wave Packet Captured successfully.
                    `;
                }

                if (waveRadius < 500) {
                    requestAnimationFrame(animate);
                } else {
                    isSimulating = false;
                }
            }
            animate();
        }

        // Render initial static layout
        drawBasePlate();
    </script>
</body>
</html>
