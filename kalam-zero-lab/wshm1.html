<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 1: PZT Lamb Wave Propagation & Defect Scattering</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.5; }
        header { border-bottom: 2px solid #333; margin-bottom: 20px; }
        .grid-container { display: flex; gap: 20px; flex-wrap: wrap; }
        section { background: #f9f9f9; padding: 15px; border-radius: 6px; flex: 1; min-width: 280px; }
        canvas { background: #111; border-radius: 4px; display: block; margin-top: 10px; }
        .ascan-box { background: #fff; border: 1px solid #ccc; padding: 10px; min-height: 80px; font-family: monospace; }
        .arjun-box { background: #eef6ff; border-left: 4px solid #0066cc; padding: 12px; margin-top: 10px; min-height: 60px; }
    </style>
</head>
<body>

    <header>
        <h2>Experiment 1: PZT Lamb Wave Propagation & Defect Scattering</h2>
    </header>
    
    <div class="grid-container">
        <!-- Visualization Area -->
        <section>
            <h3>Wave Propagation (Slow Visualization)</h3>
            <canvas id="waveCanvas" width="600" height="400"></canvas>
        </section>

        <!-- Control & Data Output Panel -->
        <section>
            <h3>Experiment Controls</h3>
            <button id="actuateBtn">Trigger Actuation</button>
            <br><br>
            <hr>
            <h3>A-Scan Data Output</h3>
            <div id="ascanOutput" class="ascan-box">
                Awaiting actuation...
            </div>
        </section>
    </div>

    <!-- AI Integration Section -->
    <section style="margin-top: 20px;">
        <h3>AI Assistant Integration (ARJUN)</h3>
        <div id="arjunPanel" class="arjun-box">
            <p><em>AI Agent ARJUN will analyze the ToF (Time of Flight) here.</em></p>
        </div>
    </section>

</body>
</html>
